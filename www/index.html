<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Range Caddy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Range Caddy">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F5233">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');
:root{--ink:#16281D;--fairway:#2F5233;--fairway-light:#4C7A52;--chalk:#F6F4EC;--paper:#FFFFFF;--flag:#C99A4B;--flag-dark:#A67B33;--slate:#3F6B45;--line:#E1DDD0;--danger:#B3462C;}
*{box-sizing:border-box;}
svg{vertical-align:middle;flex-shrink:0;}
html,body{margin:0;}
body{background:#EDEAE0;font-family:'Inter',sans-serif;color:var(--ink);}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:#EDEAE0 url('background.png') center/cover no-repeat;}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:transparent;display:flex;flex-direction:column;}
#content{flex:1;padding:calc(env(safe-area-inset-top, 0px) + 32px) 18px calc(env(safe-area-inset-bottom, 0px) + 104px);overflow-y:auto;}
.navbar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px 20px;background:transparent;}
.navpill{display:flex;align-items:center;gap:2px;background:var(--ink);border-radius:999px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.35);}
.navbtn{background:none;border:none;cursor:pointer;padding:11px 17px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);}
.navbtn.active{background:rgba(255,255,255,.16);color:#fff;}
.navicon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.navavatarbtn{width:44px;height:44px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;background:var(--flag);color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.3);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.navavatarbtn.active{border-color:var(--fairway);}
.navavatarbtn img{width:100%;height:100%;object-fit:cover;display:block;}
h1,h2,h3{font-family:'Inter',sans-serif;font-weight:900;letter-spacing:-0.01em;margin:0 0 4px;color:#000;text-shadow:0 0 4px #fff,0 0 9px #fff,0 0 16px rgba(255,255,255,.95),0 0 26px rgba(255,255,255,.75);}
h1{font-size:25px;}
h2{font-size:17px;}
p{margin:0 0 8px;line-height:1.45;}
.muted{color:#000;font-weight:600;font-size:13px;text-shadow:0 0 4px #fff,0 0 9px #fff,0 0 15px rgba(255,255,255,.9);}
.num{font-family:'JetBrains Mono',monospace;font-weight:600;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px;}
.card.focus{border-left:4px solid var(--flag);}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pill{display:inline-block;background:var(--fairway);color:var(--chalk);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;}
.diffbtn{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px;border:1.5px solid var(--fairway);background:var(--paper);color:var(--fairway);cursor:pointer;}
.diffbtn.active{background:var(--fairway);color:var(--chalk);}
.difftag{display:inline-block;margin-top:2px;font-size:11.5px;font-weight:700;color:var(--flag-dark);}
.perfbadge{display:inline-block;background:var(--flag);color:var(--ink);font-size:10.5px;font-weight:700;padding:2px 8px 2px 6px;border-radius:20px;margin-left:6px;vertical-align:middle;white-space:nowrap;}
.eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fairway);font-weight:600;}
.btn{font-family:'Inter',sans-serif;font-weight:700;font-size:15px;background:var(--fairway);color:var(--chalk);border:none;border-radius:14px;padding:13px 16px;cursor:pointer;width:100%;}
.btn:active{background:var(--fairway-light);}
.btn.secondary{background:var(--paper);color:var(--fairway);border:1.5px solid var(--fairway);}
.btn.danger{background:var(--danger);}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px;}
.bigbtn{padding:19px 16px;font-size:17px;border-radius:18px;box-shadow:0 5px 16px rgba(47,82,51,.28);}
/* --- Splash / loading screen (paints before any script runs, fades out once the app is ready) --- */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 30%, #3E6B44 0%, #2F5233 42%, #1C3520 74%, #16281D 100%);
  transition:opacity .45s ease, visibility .45s ease;}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splashinner{display:flex;flex-direction:column;align-items:center;animation:splashIn .6s ease both;}
.splashlogo{width:112px;height:112px;border-radius:28px;overflow:hidden;background:var(--chalk);
  box-shadow:0 12px 40px rgba(0,0,0,.45), 0 0 0 5px rgba(255,255,255,.12);}
.splashlogo img{width:100%;height:100%;object-fit:cover;display:block;}
.splashname{margin-top:22px;font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:700;letter-spacing:.14em;color:#fff;line-height:1;}
.splashdots{position:absolute;bottom:14%;display:flex;gap:9px;}
.splashdots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);animation:splashDot 1.2s ease-in-out infinite;}
.splashdots span:nth-child(2){animation-delay:.16s;}
.splashdots span:nth-child(3){animation-delay:.32s;}
@keyframes splashIn{from{opacity:0;transform:translateY(14px) scale(.94);}to{opacity:1;transform:none;}}
@keyframes splashDot{0%,80%,100%{opacity:.3;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
@media (prefers-reduced-motion: reduce){.splashinner,.splashdots span{animation:none;}}
/* --- Today page --- */
.herocard{background:var(--fairway);color:var(--chalk);border-radius:22px;padding:18px 18px 20px;margin-top:10px;box-shadow:0 6px 20px rgba(47,82,51,.3);}
.herotop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.herohi{font-size:22px;font-weight:800;line-height:1.15;}
.herodate{font-size:12px;font-weight:700;opacity:.85;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.herostats{display:flex;gap:10px;margin-top:16px;}
.herostat{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 8px;text-align:center;}
.herostatnum{font-family:'Barlow Condensed',sans-serif;font-size:26px;line-height:1;}
.herostatlbl{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;opacity:.85;margin-top:3px;}
.progwrap{height:10px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:16px;overflow:hidden;}
.progbar{height:100%;background:var(--flag);border-radius:99px;transition:width .3s;}
.progtext{font-size:12px;font-weight:700;margin-top:8px;opacity:.9;}
.startbtn{width:100%;margin-top:14px;padding:17px;border:none;border-radius:16px;background:var(--flag);color:var(--ink);font-family:'Inter',sans-serif;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);}
.startbtn:active{opacity:.85;}
.startbtn.done{background:rgba(255,255,255,.9);}
.timecard{background:var(--paper);border-radius:16px;padding:11px 14px;margin-top:11px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.timerow{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.stepbtn{width:40px;height:40px;border-radius:12px;border:2px solid var(--fairway);background:var(--paper);color:var(--fairway);font-size:21px;font-weight:800;cursor:pointer;flex-shrink:0;font-family:'Inter',sans-serif;}
.stepbtn:active{background:var(--fairway);color:var(--chalk);}
.timeval{text-align:center;flex:1;}
.timenum{font-family:'Barlow Condensed',sans-serif;font-size:30px;line-height:1;}
.timelbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.65;}
/* Text that sits directly on the background photo needs a solid panel behind it — a glow alone
   disappears against a bright sky. */
.sectionband{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px;padding:10px 13px;margin:20px 0 10px;box-shadow:0 2px 10px rgba(0,0,0,.1);}
.sectionband:first-child{margin-top:0;}
.sectionhead{margin:0;font-size:19px;color:var(--ink);text-shadow:none;}
.sectionsub{font-size:12.5px;line-height:1.4;margin:4px 0 0;color:var(--ink);font-weight:600;text-shadow:none;opacity:.85;}
.bandbtns{display:flex;gap:16px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
.bandbtns .linkbtn{color:var(--fairway);text-shadow:none;font-size:13px;}
.areahead{display:flex;align-items:center;gap:8px;background:var(--fairway);color:var(--chalk);border-radius:14px;padding:11px 14px;margin:20px 0 10px;box-shadow:0 3px 12px rgba(47,82,51,.25);}
.areahead:first-child{margin-top:0;}
.areahead.areadone{opacity:.55;}
.areaicon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;background:var(--chalk);border-radius:50%;font-size:16px;}
.areaname{font-size:16px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.areameta{font-size:11.5px;font-weight:600;opacity:.85;margin-top:2px;}
.areatime{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;opacity:.9;}
.areahint{flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;opacity:.75;}
.areaprog{flex-shrink:0;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;background:rgba(255,255,255,.16);border-radius:9px;padding:4px 10px;}
.areaprog.done{background:var(--flag);color:var(--ink);}
.drillcard.ingroup{margin-left:10px;}
.drillcard{background:var(--paper);border-radius:18px;padding:15px 16px;margin-bottom:11px;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;gap:13px;align-items:flex-start;position:relative;}
.drillcard.isdone{opacity:.6;}
.drillcard.focus{border-left:5px solid var(--flag);padding-left:12px;}
.drillnum{flex-shrink:0;width:30px;height:30px;border-radius:10px;background:var(--fairway);color:var(--chalk);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.drillbody{flex:1;min-width:0;cursor:pointer;}
.drillarea{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--fairway);opacity:.85;}
.drillname{font-size:16.5px;font-weight:800;margin:3px 0 4px;line-height:1.25;}
.drilldesc{font-size:13px;line-height:1.4;opacity:.75;}
.drilltarget{font-size:12.5px;font-weight:700;margin-top:7px;background:var(--chalk);border-radius:9px;padding:6px 9px;display:inline-block;}
.drillopen{font-size:12.5px;font-weight:800;color:var(--fairway);margin-top:9px;display:inline-block;}
.bigcheck{flex-shrink:0;width:42px;height:42px;border-radius:50%;border:2.5px solid var(--fairway);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:var(--fairway);cursor:pointer;}
.bigcheck.done{background:var(--fairway);color:var(--chalk);}
.adjustbtn{width:100%;margin-top:2px;margin-bottom:12px;padding:13px;border-radius:14px;border:1.5px dashed var(--fairway);background:var(--paper);color:var(--fairway);font-family:'Inter',sans-serif;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.adjustpanel{background:var(--paper);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.adjustlbl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.6;margin:12px 0 6px;}
.adjustlbl:first-child{margin-top:0;}
.adjustrow{display:flex;gap:8px;flex-wrap:wrap;}
.adjustrow .btn{width:auto;flex:1;min-width:120px;padding:11px 12px;font-size:13.5px;border-radius:12px;}
/* "What do you want to work on today?" picker */
.focusbtn{width:100%;margin-bottom:12px;padding:13px;border-radius:14px;border:1.5px solid var(--fairway);background:var(--paper);
  color:var(--fairway);font-family:'Inter',sans-serif;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.07);}
/* the two disclosure buttons are a matched pair — keep them the same size even if one wraps */
.focusbtn,.adjustbtn{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;}
.focusbtn:active{background:#EFF4ED;}
.focuscard{background:var(--paper);border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:0 2px 10px rgba(0,0,0,.09);}
.focusgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
.focuschip{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);
  color:var(--ink);font-family:'Inter',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-align:left;line-height:1.2;}
.focuschip.on{border-color:var(--fairway);background:#EFF4ED;}
.focustick{flex-shrink:0;width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line);background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--chalk);}
.focuschip.on .focustick{background:var(--fairway);border-color:var(--fairway);}
.pttotal{display:flex;align-items:center;justify-content:space-between;background:var(--chalk);border-radius:10px;padding:8px 11px;margin:9px 0 4px;font-size:13px;font-weight:800;}
.ptsection{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--fairway);margin:12px 0 2px;}
.ptrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);}
.ptname{font-size:13px;min-width:0;}
.cardacts{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:9px;}
.cardact{font-size:12px;}
.addrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
.addname{font-size:13px;font-weight:700;line-height:1.25;}
.adddesc{font-size:11.5px;opacity:.7;line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.focuschip[disabled]{cursor:default;}
.focusactive{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border-left:4px solid var(--flag);
  border-radius:12px;padding:9px 12px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.sessiontimer{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.sessionclock{font-size:22px;font-weight:600;line-height:1;display:inline-block;vertical-align:middle;}
.timerstate{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;margin-left:8px;vertical-align:middle;opacity:.55;}
.timerstate.live{color:var(--fairway);opacity:1;}
.ctrlcard{background:var(--paper);border-radius:14px;padding:11px 14px;margin-bottom:9px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.ctrllbl{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.6;margin-bottom:6px;}
.ctrlcard .ctrllbl + .adjustrow, .ctrlcard .diffrow + .ctrllbl{margin-top:0;}
.ctrlcard .ctrllbl:not(:first-child){margin-top:11px;}
.diffrow{display:flex;gap:7px;}
.diffrow .diffbtn{flex:1;font-size:13px;padding:9px 8px;border-radius:10px;border-width:2px;}
.stepcard{background:var(--paper);border-radius:16px;border-left:5px solid var(--fairway);padding:14px 16px;margin-top:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.stepcardlbl{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--fairway);margin-bottom:6px;}
.stepcardtxt{font-size:14.5px;line-height:1.5;}
.steplist{margin:0;padding-left:0;list-style:none;counter-reset:stepc;}
.steplist li{counter-increment:stepc;position:relative;padding-left:30px;font-size:14.5px;line-height:1.5;margin-bottom:9px;}
.steplist li:last-child{margin-bottom:0;}
.steplist li::before{content:counter(stepc);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--fairway);color:var(--chalk);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.explaincard{border-left-color:var(--slate);}
.explainp{font-size:14px;line-height:1.55;margin:0 0 12px;}
.explainp:last-child{margin-bottom:0;}
.explainp strong{display:block;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--fairway);margin-bottom:3px;}
.drillnav{margin-top:16px;}
.drillnavpos{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;text-align:center;margin:0 auto 10px;color:var(--ink);text-shadow:none;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:99px;padding:6px 14px;width:fit-content;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.detailflag{margin-top:12px;background:var(--fairway);color:var(--chalk);border-radius:14px;padding:13px 16px;font-weight:800;font-size:14.5px;text-align:center;}
.welcomehero{text-align:center;margin-top:22px;}
.welcomelogo{width:104px;height:104px;margin:0 auto;overflow:hidden;background:var(--paper);box-shadow:0 6px 20px rgba(0,0,0,.18);}
.welcomelogo img{width:100%;height:100%;object-fit:cover;}
.welcometitle{margin-top:16px;font-size:34px;line-height:1.1;}
.welcometag{margin-top:14px;font-size:16px;font-weight:600;line-height:1.5;color:var(--ink);text-shadow:none;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.1);}
.welcomesteps{margin:26px 0 24px;display:flex;flex-direction:column;gap:12px;}
.welcomestep{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border-radius:16px;padding:15px 16px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.stepnum{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--fairway);color:var(--chalk);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
.steptitle{font-weight:800;font-size:15.5px;margin-bottom:3px;}
.stepdesc{font-size:13.5px;line-height:1.45;opacity:.78;}
label{display:block;font-size:11.5px;color:#000;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 5px;font-family:'Barlow Condensed',sans-serif;}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font-family:'Inter';font-size:14px;background:var(--paper);color:var(--ink);}
textarea{resize:vertical;min-height:50px;}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);font-family:'Inter';}
.chip.active{background:var(--fairway);color:var(--chalk);border-color:var(--fairway);}
.rankrow2{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px 16px 15px 13px;margin-bottom:11px;box-shadow:0 2px 6px rgba(22,40,29,.08);}
.rankbadge{width:36px;height:36px;border-radius:50%;background:var(--fairway);color:var(--chalk);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:18px;flex-shrink:0;}
.rankicon{width:44px;height:44px;border-radius:50%;background:var(--chalk);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
.rankname{flex:1;font-weight:700;font-size:17px;}
.rankgrip{display:none;}
.rankarrows{display:flex;gap:6px;flex-shrink:0;}
.rankarrows button{width:44px;height:44px;border-radius:50%;border:none;background:var(--chalk);cursor:pointer;color:var(--fairway);font-size:18px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line);transition:background .1s;}
.rankarrows button:active{background:var(--fairway);color:var(--chalk);}
.rankarrows button:disabled{opacity:.3;cursor:default;background:var(--chalk);color:var(--fairway);}
.divider{border:none;border-top:1px dashed var(--line);margin:16px 0;}
.starbtn{background:none;border:none;font-size:17px;cursor:pointer;color:var(--flag);}
.tabs{display:flex;background:var(--line);border-radius:22px;padding:4px;gap:4px;margin-bottom:14px;}
.tabbtn{flex:1;padding:10px;border-radius:18px;border:none;background:transparent;color:var(--slate);font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Inter';}
.tabbtn.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--chalk);padding:9px 18px;border-radius:20px;font-size:13px;z-index:50;}
.empty{text-align:center;padding:28px 10px;color:var(--slate);}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--flag);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:19px;flex-shrink:0;}
.statsrow{display:flex;justify-content:space-around;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.statnum{font-family:'Barlow Condensed';font-weight:700;font-size:20px;text-align:center;}
.statlabel{font-size:11px;color:var(--slate);text-align:center;text-transform:uppercase;letter-spacing:.04em;}
.inforow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
.inforow:last-child{border-bottom:none;}
.checkcircle{width:25px;height:25px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--chalk);font-size:13px;}
.checkcircle.done{background:var(--fairway);border-color:var(--fairway);}
.reps{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--fairway);font-weight:700;margin:5px 0;}
.linkbtn{color:#000;font-size:13px;font-weight:800;cursor:pointer;background:none;border:none;padding:0;font-family:'Inter';text-shadow:0 0 4px #fff,0 0 9px #fff,0 0 15px rgba(255,255,255,.9);}
.linkback{background:none;border:none;color:#000;font-weight:800;font-size:13px;cursor:pointer;padding:0;margin-bottom:10px;text-shadow:0 0 5px rgba(255,255,255,.9),0 0 10px rgba(255,255,255,.6);}
</style>

{id:'p9',area:'putting',name:'3-10ft Number Circuit',performance:true,description:'A random-order pressure loop that mimics never getting the same putt twice.',setup:'10 numbered tees (1-10) placed in random order at any distance from 3-8 ft around one hole.',repsOrTime:'Putt in numeric order 1 through 10',success:'Make all 10 in order; one redemption putt allowed at the tee you missed',difficulty:'Advanced'},

{id:'mi6',area:'mid_irons',name:'Roll The Egg',description:'Keep the club on plane in the takeaway.',setup:"Place a second ball directly behind the one you're hitting.",repsOrTime:'10 takeaways',success:'Roll the second ball straight back without hitting it sideways',difficulty:'Beginner'},
{id:'mi7',area:'mid_irons',name:'Towel Connection Drill',description:'Keep your upper and lower body connected through the swing.',setup:'Tuck a towel under both arms across your chest.',repsOrTime:'10 swings',success:'Towel stays in place through the whole swing',difficulty:'Beginner'},
{id:'mi8',area:'mid_irons',name:'Pause At The Top',description:'Smooth out your tempo and stop rushing the transition.',setup:'Any iron.',repsOrTime:'10 swings, pause at least 1 second at the top before starting down',success:'A clean, unhurried transition on every swing',difficulty:'Beginner'},
{id:'mi9',area:'mid_irons',name:'Iron Start Line Challenge',description:'Train one stock shot shape and tighten your dispersion.',setup:'Alignment stick on the ground as your start-line reference.',repsOrTime:'10 balls, one stock shape',success:'Start line matches the stick every time, no double-crosses',difficulty:'Intermediate'},
{id:'d6',area:'driver_woods',name:'Driver Fairway Simulation',description:'Score every drive on execution, not just outcome, to build course-ready commitment.',setup:'Create a fairway window using two targets or alignment sticks.',repsOrTime:'9-18 simulated tee shots, full routine on each',success:'Track how many finish in the window or in a playable miss',difficulty:'Advanced'},
{id:'p21',area:'putting',name:'30 Three-Footers',description:'A pure make-everything streak test from tap-in range.',setup:'One ball, one hole, 3ft away.',repsOrTime:'30 putts in a row',success:'Make all 30 without a miss; a miss resets the streak',difficulty:'Intermediate'},
{id:'p22',area:'putting',name:'Lag Putting Quarters',description:'A landing-zone test for speed control across four distances.',setup:'Mark 4 quarters, 1ft apart, between you and the hole. Tees at 5, 10, 20 and 30ft.',repsOrTime:'1 putt per distance',success:'5 & 10ft finish in the first two quarters, 20ft in the 1st-3rd quarters, 30ft in the 1st-4th quarters',difficulty:'Advanced'},
{id:'p23',area:'putting',name:'Two-Hole Putter-Length Ladder',description:'A back-and-forth lag drill that punishes long misses and rewards precision.',setup:'Pick 2 holes 30-40ft apart. Use 3 balls, putting from one hole to the other.',repsOrTime:'3 balls per leg, 3 round trips (there and back = 1 round)',success:'All 3 putts finish within a putter length; a make means the next putt is free, but any putt outside putter length resets that round',difficulty:'Advanced'},
{id:'p24',area:'putting',name:'30 Putt Drill',performance:true,description:'A make-percentage benchmark across five mid-range putting distances.',setup:'5 putts each from 10, 12, 15, 17 and 20ft.',repsOrTime:'30 putts total',success:'Make at least 9 of 30',difficulty:'Intermediate'},
{id:'c13',area:'chipping',name:'Chip Connection Towel Drill',description:'Keep your body connected through the chipping stroke.',setup:'Tuck a towel under both arms, wrapped across your chest.',repsOrTime:'10 chips',success:'Towel stays in place through every stroke',difficulty:'Beginner'},
{id:'c14',area:'chipping',name:'Tight Lie vs Rough Rotation',description:'Learn to adjust technique on the fly between contrasting lies.',setup:'Find one tight/bare lie and one rough lie near the green.',repsOrTime:'Alternate lies every shot, 10 shots total',success:'Clean strike and consistent distance control from both lie types',difficulty:'Advanced'},
{id:'c15',area:'chipping',name:'Five-Shot Chip Control',description:'Hit five different chip shots from the same spot to prove full command around the green.',setup:'Find a chip 10-15 yds away with a middle pin.',repsOrTime:'1 stock draw, 1 stock cut, 1 stock chip, 1 spin chip, 1 low runner — all from the same spot',success:'All five shots finish inside your target radius',difficulty:'Advanced'},
{id:'li3',area:'long_irons',name:'Tee Strike Drill',description:'Train forward weight shift and ball-then-turf contact instead of scooping.',setup:'Place a tee in the ground just past the ball, one clubhead-length in front, on your target line.',repsOrTime:'10 balls',success:'Strike the ball first, then clip the tee on your follow-through, every time',difficulty:'Intermediate'},
{id:'li4',area:'long_irons',name:'Distance Ladder',description:'Learn to control distance with the same long iron by varying backswing length and tempo, not effort.',setup:'Pick 3 targets at different distances with the same club (e.g. 150, 175, 200 yds).',repsOrTime:'3-5 balls per target, working through in order',success:'Land shots progressively closer to each target by adjusting swing length alone',difficulty:'Advanced'},
{id:'b5',area:'bunker',name:'2x4 Bunker Drill',description:'Learn to use the bounce of the club instead of digging the leading edge into the sand.',setup:'Set up for a normal splash shot with an open clubface.',repsOrTime:'10 shots, focused purely on the club skimming through the sand',success:"The club's trailing edge contacts the sand first on every shot, no digging",difficulty:'Advanced'},
{id:'b6',area:'bunker',name:'Foot Depth Drill',description:'Feel how digging your feet in deeper changes trajectory, spin and how much sand you take.',setup:'Hit the same shot 3 times: barely settled in, ankle-deep, and in between.',repsOrTime:'3 balls per foot depth',success:'Notice and describe how each depth changes ball flight and spin',difficulty:'Intermediate'},
{id:'b7',area:'bunker',name:'9-Ball Up & Down',performance:true,description:'A scored bunker game that mimics real greenside pressure.',setup:'Drop 9 balls in varied bunker lies around the green.',repsOrTime:'9 up-and-down attempts, holing out every time',success:'Track how many of the 9 you get up and down; beat your best next time',difficulty:'Advanced'},
{id:'si5',area:'short_irons',name:'Gate Strike Drill',description:'Groove a clean path and center-face contact on full short-iron swings.',setup:'Set 2 tees just wider than your clubhead, right where the ball sits.',repsOrTime:'10 balls through the gate',success:'Strike through without touching either tee, every time',difficulty:'Intermediate'},
{id:'si6',area:'short_irons',name:'Mini-Swing Drill',description:'Build a compact, controlled short-iron motion with the wrists staying ahead of the clubhead.',setup:'Address the ball and swing only from waist-high to waist-high.',repsOrTime:'10 balls',success:'Crisp, ball-first contact on every mini-swing',difficulty:'Beginner'},
{id:'d7',area:'driver_woods',name:'Path Gate Drill',description:'Train a repeatable swing path through the ball with the driver.',setup:'Set 2 alignment sticks a few feet in front of the ball, just wider than your clubhead, forming a gate.',repsOrTime:'10 drives',success:'Swing through the gate without touching either stick',difficulty:'Intermediate'},
{id:'d8',area:'driver_woods',name:'New Target Every Shot',description:'Practice like you play by never hitting the same shot twice.',setup:'Pick a brand new target for every single drive — vary distance and shape.',repsOrTime:'10 drives, 10 different targets',success:'A real pre-shot routine and committed target on every swing, no autopilot reps',difficulty:'Intermediate'},
{id:'d9',area:'driver_woods',name:'Tee Height Ladder',description:'Find your best launch window by seeing how tee height changes flight and spin.',setup:'Hit balls teed low, medium and high in turn.',repsOrTime:'5-6 drives per tee height',success:'Notice which height gives the most carry and tightest dispersion, then make it your standard',difficulty:'Intermediate'},
{id:'li5',area:'long_irons',name:'Punch Flight',description:'Take height off your long irons to control trajectory and hold the wind.',setup:'One long iron, ball back in your stance, shorter follow-through.',repsOrTime:'10 balls',success:'A consistently lower, more penetrating flight than your stock long iron',difficulty:'Advanced'},
{id:'si7',area:'short_irons',name:'Nine Windows',description:'Prove you can flight and shape the ball in every direction on command.',setup:'One short iron, one target.',repsOrTime:'9 balls — each a different combo of low/mid/high and draw/straight/fade',success:'Hit all nine windows, each clearly different in height and curve',difficulty:'Advanced'},
{id:'si8',area:'wedges_pitching',name:'Random Number Ladder',description:'Train on-course adaptability by never hitting the same yardage twice.',setup:'Pick a club and a way to call out random yardages within its range (a partner or an app).',repsOrTime:'10 balls, a new called yardage each time',success:'Land close to each called number with no warm-up rep',difficulty:'Intermediate'},
{id:'mi10',area:'mid_irons',name:'Alignment Gate',description:'Groove a repeatable start line so every ball begins on your intended path.',setup:'Stand two alignment sticks a few feet ahead of the ball, just wider than the ball, framing your start line.',repsOrTime:'10 balls',success:'Start every ball cleanly through the gate',difficulty:'Beginner'},
{id:'c16',area:'chipping',name:'Five-Club Up & Down',description:'Build greenside creativity by getting up and down with five different clubs.',setup:'Pick a greenside spot and grab five different clubs (e.g. LW, SW, GW, PW, 8-iron).',repsOrTime:'5 up-and-down attempts, one with each club',success:'Get up and down with all five, learning which club fits which situation',difficulty:'Advanced'},
{id:'c17',area:'chipping',name:'One-Club Up & Down',description:'Sharpen touch and shot-making by using a single wedge for everything.',setup:'Pick one wedge and a spot off the green with a hole to aim at.',repsOrTime:'A full session, every greenside shot with the same club',success:'Get up and down consistently using only feel and technique to vary the shots',difficulty:'Intermediate'},
{id:'tb1',area:'bunker',name:'54° Contact to Short Side',description:'Groove clean bunker contact with a 54° first so the 60° feels easy afterwards.',setup:'Short-sided bunker lie with the pin close to your edge of the green.',repsOrTime:'10-15 balls with the 54°, then switch to the 60°',success:'Consistent sand entry point and every ball finishing on the green',difficulty:'Beginner'},
{id:'tb2',area:'bunker',name:'Bunker Landing Areas',description:'Control where the ball first lands out of the sand instead of just getting it out.',setup:'Place 3 tees in a line on the green about 10 ft apart. Start about 7 yards from the first tee. Use the 60°.',repsOrTime:'Work through all 3 tees, several balls each',success:'Land within 3 ft of each tee',difficulty:'Intermediate'},
{id:'tb3',area:'bunker',name:'Short Sided Lie Test',performance:true,description:'A scored test of every awkward bunker lie you actually face on the course.',setup:'Short-sided pin. Play each of these lies: perfect, ball sitting down slightly, upslope, downslope, ball above feet, ball below feet.',repsOrTime:'1 ball from each of the 6 lies',success:'PGA Tour average is inside 6 ft — measure and total your proximity',difficulty:'Advanced'},
{id:'tb4',area:'bunker',name:'9 Hole Random Bunker',performance:true,description:'A 9-shot bunker scoring test mixing short and long sand shots.',setup:'Pick 9 random bunker shots around the practice bunker, including some long ones that call for the 54°.',repsOrTime:'9 shots, 1 ball each',success:'PGA Tour average is inside 6 ft each, or 54 ft total for all 9',difficulty:'Advanced'},
{id:'tmi11',area:'mid_irons',name:'Two-Club Distance Tolerance',performance:true,description:'A tour-standard iron test on hitting exact numbers inside a tight left/right window.',setup:'Range with clear yardage markers. Hit 2 clubs to each of these distances: 95, 105, 115, 125, 135, 145, 155, 165, 175, 185, 195.',repsOrTime:'2 balls per distance',success:'Carry tolerance ±2 yds up to 125, ±3 to 155, ±4 to 175, ±5 beyond. Left/right tolerance 10 ft up to 115, 15 ft to 145, 20 ft to 175, 25 ft beyond',difficulty:'Advanced'},
{id:'tp25',area:'putting',name:'Short Pace Drill',description:'Learn to roll short putts at the right speed by using a marker behind the hole.',setup:'Use a fake hole with a marker 2 ft behind it. Putt from 6, 9, 12, 15 and 18 ft, both uphill and downhill.',repsOrTime:'5 putts total finishing between the hole and the marker, or start over',success:'5 in a row that stop between the hole and the marker',difficulty:'Intermediate'},
{id:'tp26',area:'putting',name:'Long Pace Work',description:'Build lag speed control from real long-putt distances.',setup:'Putt from 20, 30, 40, 50 and 60 ft, uphill and downhill. The 20-footer must reach the hole.',repsOrTime:'5 putts in a row inside 3 ft or start over',success:'5 in a row inside 3 ft at each distance',difficulty:'Advanced'},
{id:'tp27',area:'putting',name:'Green Reading 9 Holes',description:'Train your read by committing to an apex and a line before every putt.',setup:'Play 9 holes on the practice green with 2 coins — one at the apex and one parallel to the hole, based on your green-reading style. Alternate right-to-left and left-to-right putts.',repsOrTime:'9 holes',success:'Ball rolls over your apex coin on the majority of putts',difficulty:'Intermediate'},
{id:'tp28',area:'putting',name:'10 Ball Game',performance:true,description:'A short scored make test across five distances.',setup:'2 putts each from 4, 6, 8, 10 and 12 ft. Change the hole each time.',repsOrTime:'10 putts',success:'PGA Tour average is 6/10',difficulty:'Intermediate'},
{id:'tp29',area:'putting',name:'25-Ball Make Drill',performance:true,description:'The big make-count benchmark — as random as you can make it.',setup:'5 putts from each of 4, 6, 8, 10 and 12 ft. Switch holes each putt and make it as random as possible.',repsOrTime:'25 putts',success:'PGA Tour average 14/25 · Elite 16/25 · Record 19/25',difficulty:'Advanced'},
{id:'tp30',area:'putting',name:'Random Putt Challenge',performance:true,description:'20 fully random putts, exactly like you face them in a round.',setup:'Putt these distances in order: 10, 12, 8, 20, 12, 6, 15, 10, 17, 4, 12, 8, 15, 10, 4, 17, 20, 6, 12, 10 ft.',repsOrTime:'20 putts',success:'PGA Tour average is 9/20',difficulty:'Advanced'},
{id:'tp31',area:'putting',name:'Perfect Putting Board',description:'Block practice on a putting board to lock in a repeatable stroke.',setup:'Set the putting board up on a 5 ft putt.',repsOrTime:'Make 10 in a row from each angle — straight, left-to-right, right-to-left (30 putts total)',success:'All three sets of 10 in a row completed',difficulty:'Intermediate'},
{id:'tp32',area:'putting',name:'Breaking Putt Practice',description:'Prove your read by putting through a gate at the break point.',setup:'Pick a 10-20 ft breaking putt. Read it, then place 2 tees about 6 in apart at the break point of the putt. Putt through the tees, adjusting the tees until you hole it.',repsOrTime:'10 makes left-to-right and 10 makes right-to-left',success:'20 total makes through the gate',difficulty:'Advanced'},
{id:'tp33',area:'putting',name:'Humpty Dumpty',description:'Trains a square face on short putts by giving you a tiny target.',setup:'A row of 5 balls on top of tees, spaced about 6 in apart. Putt from 3 ft away from the line.',repsOrTime:'Knock all 5 off in a row',success:'All 5 tees struck and balls knocked off consecutively',difficulty:'Intermediate'},
{id:'tp34',area:'putting',name:'Short Speed Drill',description:'Control exactly where the ball enters the cup from short range.',setup:'Putts from 3, 4 and 5 ft.',repsOrTime:'3 putts at each distance — front of the cup, middle of the hole, back of the cup',success:'All 9 putts made at the intended speed',difficulty:'Intermediate'},
{id:'tp35',area:'putting',name:'Clock Drill',description:'A classic short-putt circuit that builds volume from every angle.',setup:'Picture the hole as a clock face.',repsOrTime:'Make 12 two-footers from 12:00, 9 three-footers from 9:00, 6 four-footers from 6:00 and 3 five-footers from 3:00',success:'All 30 putts made',difficulty:'Beginner'},
{id:'tp36',area:'putting',name:'Spoke Drill: Hard',description:'A brutal in-a-row short putt test with escalating distances.',setup:'Tees around the hole at 3, 6 and 10 ft.',repsOrTime:'Make 25 three-footers, 10 six-footers, then 7 ten-footers — all in a row',success:'Complete every level. If you miss, restart the level you are on',difficulty:'Advanced'},
{id:'tp37',area:'putting',name:'Spoke Drill: Med',description:'A shorter in-a-row spoke test for a strong maintenance session.',setup:'Tees around the hole at 4, 5 and 8 ft.',repsOrTime:'Make 30 in a row from 4 ft, then 6/6 from 5 ft and 5/6 from 8 ft',success:'All three targets hit',difficulty:'Intermediate'},
{id:'tp38',area:'putting',name:'3-4-5 Spoke Drill',description:'A quick 12-putt in-a-row circuit around the hole.',setup:'Set up 3, 4 and 5 ft spoke circles around the hole with tees.',repsOrTime:'One ball from each tee — 12 putts total',success:'Make all 12 in a row to complete',difficulty:'Intermediate'},
{id:'tp39',area:'putting',name:'Pressure Putts',description:'Simulates a raised heart rate so you practise under real nerves.',setup:'Find a flat 5 ft putt and clear space to jog.',repsOrTime:'Jog around the green, then make 5 five-footers in a row',success:'5 in a row immediately after the jog',difficulty:'Intermediate'},
{id:'tp40',area:'putting',name:'Drawback',description:'Lag putting where a sloppy first putt costs you.',setup:'Play 6 holes on the practice green from 20-40 ft. If the ball does not finish between a grip length and the hole, draw it back a full putter length.',repsOrTime:'6 holes',success:'Finish +1 or better',difficulty:'Advanced'},
{id:'tp41',area:'putting',name:'Speed Control (Eyes on Hole)',description:'Train pure feel by looking at the hole while you putt.',setup:'Long putts from 30-40 ft, plus a 2 ft circle around the hole for the second part.',repsOrTime:'2-putt 5 different putts in a row looking at the hole on your first putt, then hit 5 different 20-footers in a row that finish inside a 2 ft circle',success:'Both sets of 5 completed in a row',difficulty:'Advanced'},
{id:'tp42',area:'putting',name:'Four Corners',description:'Great pre-round speed calibration for any green.',setup:'Put four balls in the middle of the green.',repsOrTime:'Putt one ball to the fringe in all four directions, repeat until each stops within a putter length of the fringe',success:'All four directions dialled in',difficulty:'Beginner'},
{id:'tp43',area:'putting',name:'Lag Speed Drill',description:'Advance through distances only when your speed is perfect.',setup:'Alignment stick 2 ft behind the hole. Tees at 5, 10, 15, 20, 25 and 30 ft.',repsOrTime:'Make the first putt to move back; from then on the ball must finish between the hole and the stick to advance',success:'Clear every distance in a row, or start over',difficulty:'Advanced'},
{id:'tp44',area:'putting',name:'High Side Speed Drill',description:'Adds a start-line requirement to the lag speed ladder.',setup:'Use right-to-left or left-to-right breaking putts. Alignment stick 2 ft behind the hole, tees at 5, 10, 15, 20, 25 and 30 ft.',repsOrTime:'Ball must finish between hole and stick AND get past the front edge of the hole on the high side to advance',success:'Clear every distance in a row, or start over',difficulty:'Advanced'},
{id:'tp45',area:'putting',name:'A-B-C Ladder Drill',description:'Precision lag control using a four-tee landing ladder.',setup:'Put 4 tees in the green 3 ft apart (A, B, C, B, A pattern). Putt from 15, 20, 30 and 40 ft.',repsOrTime:'Stop the ball at A, B, C, B, A then move to the next distance',success:'Complete the pattern at all four distances — make them in a row to add difficulty',difficulty:'Advanced'},
{id:'tp46',area:'putting',name:'2 Putt Game',performance:true,description:'An 18-hole two-putt survival test from long range.',setup:'Use one ball, putting from 20 ft, then 30 ft, then 40 ft.',repsOrTime:'1 or 2 putt 18 holes in a row',success:'18 holes in a row without a 3-putt, or start over',difficulty:'Advanced'},
{id:'tp47',area:'putting',name:'Finish Strong',description:'Three different pressure putts you must knock out consecutively.',setup:'Find a 40 ft putt, a 12 ft putt and a 5 ft left-to-right breaker.',repsOrTime:'2-putt the 40-footer, make the 12-footer, make the 5 ft breaker',success:'All three in a row to be done',difficulty:'Intermediate'},
{id:'tp48',area:'putting',name:'Makes 10-15',description:'A mid-range make test using a different putt every time.',setup:'Pick putts between 10 and 15 ft on the practice green.',repsOrTime:'Make 3 out of 5 — every putt must be a different one',success:'3 of 5 made, or start over',difficulty:'Advanced'},
{id:'tp49',area:'putting',name:'80 Putts',performance:true,description:'The full putting benchmark — 80 putts scored across five distances.',setup:'Set up putts at 3, 4, 5, 6 and 10 ft.',repsOrTime:'30 from 3 ft, 25 from 4 ft, 10 from 5 ft, 10 from 6 ft, 5 from 10 ft',success:'Goals: 30/30, 25/25, 10/10, 7/10, 2/10 — total goal is 74 one-putts',difficulty:'Advanced'},
{id:'tc18',area:'chipping',name:'Landing Spot Contact Drill',description:'Control the first bounce with both wedges and three trajectories.',setup:'Place 3 tees on the green in a line about 15 ft apart. Start about 10 yards from the first tee.',repsOrTime:'Hit low, medium and "highish" to each tee with both the 54° and the 60°',success:'Land within 3 ft of each tee',difficulty:'Intermediate'},
{id:'tc19',area:'chipping',name:'Random 3-Spot Fairway Chips',description:'Basic-to-medium random chipping with two clubs from every spot.',setup:'Pick 3 different chip shots from the fairway around the green.',repsOrTime:'2 balls from each spot with a different club — 6 shots total',success:'Every shot must finish inside 5 ft to pass',difficulty:'Intermediate'},
{id:'tc20',area:'chipping',name:'9 Hole Random Short Game',performance:true,description:'A 9-shot short game scoring test across easy, medium and hard lies.',setup:'Pick 9 random shots around the green varying between easy, medium and hard.',repsOrTime:'9 shots, 1 ball each',success:'PGA Tour average would be UNDER 45 ft total proximity',difficulty:'Advanced'},
{id:'tc21',area:'chipping',name:'Consecutive Up & Downs',description:'Five different chips, five different holes, all must be converted.',setup:'Take out 5 balls and hit each to a different pin — pick 1 easy, 3 medium and 1 hard. Then go putt all 5 out.',repsOrTime:'5 up and downs',success:'Get all 5 up and down before you are done',difficulty:'Advanced'},
{id:'tc22',area:'chipping',name:'Landing Spot Chip Test',performance:true,description:'Knock out each wedge by proving you can land it on a towel.',setup:'Set your golf towel about 3-5 yards onto the green. Use all of your wedges.',repsOrTime:'Land 4 of 5 shots on the towel with one club to knock that club out, then repeat with every other wedge',success:'All wedges knocked out',difficulty:'Advanced'},
{id:'tc23',area:'chipping',name:'Up & Down Chipping Test',performance:true,description:'Nine varied greenside shots scored on how many you get inside 5 ft.',setup:'Pick 9 different shots around the green — 3 easy, 3 medium, 3 hard. Every shot is different, drop your ball on every shot.',repsOrTime:'9 shots, measure with your own feet',success:'Get 5 of the 9 within 5 ft. If you only get 4, start over. Target is 60% up and down',difficulty:'Advanced'},
{id:'tc24',area:'chipping',name:'Proximity Chipping Test',performance:true,description:'A scored proximity game where only tight chips keep you at even.',setup:'Pick 9 different shots around the green.',repsOrTime:'9 shots — inside 6 ft is EVEN, outside 6 ft is +1, a make is -1',success:'Finish +3 or better',difficulty:'Advanced'},
{id:'tw6',area:'wedges_pitching',name:'50-60-70 Baskets',description:'Great par-5 layup practice hitting three exact wedge numbers.',setup:'Place baskets at 50, 60 and 70 yards.',repsOrTime:'Make 2 balls into each basket, but never 2 in a row into the same basket, and only 5 balls in a row to any one basket',success:'2 balls in all three baskets',difficulty:'Advanced'},
{id:'td10',area:'driver_woods',name:'14 Pile Drill',description:'A fairway-finding game with your longest clubs where misses cost you.',setup:'Pick two targets 25 yards apart. Start with 14 balls in a pile.',repsOrTime:'Alternate between your woods, driver and hybrids — no more than 1 ball with each club in a row. Miss the gap and add 2 balls to the pile',success:'Finish when the pile is gone',difficulty:'Advanced'}

const DIFF_RANK = {Beginner:0, Intermediate:1, Advanced:2};
// How much drill difficulty a handicap can carry, on the same 0-2 scale as DIFF_RANK.
// Kept as a decimal so a 4 and a 14 handicap don't get treated as the same player.
function handicapTierF(hcp){
  const n = handicapNum(hcp);
  if(n <= 0)  return 2.0;   // scratch or better
  if(n <= 5)  return 1.8;
  if(n <= 10) return 1.5;
  if(n <= 15) return 1.1;
  if(n <= 20) return 0.8;
  if(n <= 28) return 0.4;
  return 0.1;
}
// How much harder work someone's commitment to the game lets them take on.
const COMMIT_TIER = {casual:-0.35, regular:0, serious:0.2, competitive:0.4};
const COMMIT_LABEL = {casual:'Casual', regular:'Regular', serious:'Serious', competitive:'Competitive'};
// Work out the target difficulty (0-2) from handicap and commitment. The golfer is never asked
// or shown a "level" — it's inferred here and only ever surfaces as which drills they're given.
function targetTierF(profile){
  if(!profile) return 1;
  let t = handicapTierF(profile.handicap);
  t += COMMIT_TIER[profile.commitment||'regular'] || 0;
  return Math.max(0, Math.min(2, t));
}
function targetTier(profile){ return Math.max(0, Math.min(2, Math.round(targetTierF(profile)))); }
// Easier/Harder doesn't swap the drills — it only nudges the target. This note is shown on each drill's goal.
function targetTweak(){ const p=state.profile&&state.profile.difficultyPref;
  if(p==='harder') return ' <span class="difftag">Harder — push it: add reps or tighten your success margin</span>';
  if(p==='easier') return ' <span class="difftag">Easier — ease it: fewer reps or a wider margin</span>';
  return ''; }
// Pick drills that actually MATCH the golfer rather than everything they could survive.
// A scratch player shouldn't be handed beginner drills, and a 25 handicap shouldn't be
// handed advanced ones — so we keep the band around their target difficulty and only widen
// it when there aren't enough drills in that band to fill a session.
function filterByDifficulty(pool, profile){
  if(!pool.length) return pool;
  // Scratch and better get the whole library — every drill is fair game at that level,
  // easy ones included, since they're using them for sharpening rather than learning.
  if(handicapNum(profile && profile.handicap) <= 0) return pool;
  const t = targetTierF(profile);
  const dist = d => Math.abs((DIFF_RANK[d.difficulty] ?? 1) - t);
  // nothing more than about a tier above them — that's discouraging, not useful
  let ok = pool.filter(d => (DIFF_RANK[d.difficulty] ?? 1) <= t + 0.7);
  if(!ok.length) ok = pool.slice();
  // The better the player, the wider the band — a 1 handicap shouldn't fall off a cliff into
  // "Advanced only" just because they're a shot outside scratch.
  const band = 0.75 + Math.max(0, t - 1.3) * 1.1;
  const close = ok.filter(d => dist(d) <= band);
  if(close.length >= 2) return close;
  const wider = ok.filter(d => dist(d) <= band + 0.5);
  if(wider.length >= 2) return wider;
  return ok.slice().sort((a,b)=>dist(a)-dist(b));
}

function selectTodayGames(favorites, rand){

  // since several on-course games (like 3-Ball Scramble) are also tagged performance.
  const perfGames = pickPool(PRACTICE_GAMES.filter(g=>g.performance)).slice(0,2);
  return [...perfGames, courseGame].filter(Boolean);   // on-course game shown last
}
/* Turn whatever the golfer typed for handicap into a number. "+2" (better than scratch)
   becomes -2, "scratch" becomes 0, anything unreadable falls back to a mid handicap. */
function handicapNum(h){
  if(h===null || h===undefined) return 15;
  const s = String(h).trim().toLowerCase();
  if(!s) return 15;
  if(s.indexOf('scratch')>=0) return 0;
  if(s[0]==='+'){ const p=parseFloat(s.slice(1)); return isNaN(p)?0:-p; }
  const n = parseFloat(s);
  return isNaN(n) ? 15 : n;
}
/* How many EXTRA drills (beyond one per area) the golfer gets at their normal session length.
   Scratch (0) at Regular commitment is the reference: 2 drills in every area that supports it,
   1 for bunker / mid irons / long irons. The higher the handicap, the tighter the session, so
   the time goes into the parts of the game they need most instead of being spread thin.
   A plus handicap earns one more, and how committed they are shifts it either way. */
function extraDrillBudget(profile){
  const h = handicapNum(profile.handicap);
  let b;
  if(h < 0)        b = 6;   // plus handicap — better than scratch
  else if(h === 0) b = 5;   // scratch
  else if(h <= 5)  b = 4;
  else if(h <= 12) b = 3;
  else if(h <= 20) b = 2;
  else             b = 1;   // high handicap — focus hard on the top of their list
  const c = {casual:-1, regular:0, serious:1, competitive:2}[profile.commitment||'regular'] || 0;
  return Math.max(0, b + c);
}

function isTempoDrill(d){ return !!d && /tempo/i.test(d.name||''); }
function computePlan(dateStr, minutes, salt, excludeIds){

  const ranking = focus ? state.ranking.filter(a=>focus.includes(a)) : state.ranking;
  if(!ranking.length) return {date:dateStr, minutes, items:[], perfDrills:[], games:[], swingWork:null};
  const total = minutes;
  const n = ranking.length; const weights={}; let sumW=0;
  ranking.forEach((a,idx)=>{ const w=n-idx; weights[a]=w; sumW+=w; });
  const minutesPerArea={}; let allocated=0;
  ranking.forEach(a=>{ const m=Math.round(total*weights[a]/sumW); minutesPerArea[a]=m; allocated+=m; });
  minutesPerArea[ranking[0]] += (total-allocated);
  const pref0 = profile.startOrder && profile.startOrder.length ? profile.startOrder : [profile.startArea];
  const pref = focus ? pref0.filter(a=>focus.includes(a)) : pref0;
  const order = [...pref, ...ranking.filter(a=>!pref.includes(a))];
  const rand = mulberry32(hashStr(dateStr+'|'+(salt||'')));
  // Fewer time / "Fewer Drills" mode: shrink to 1 drill per area (min ~8-9 total with calibration).
  // Bunker can drop out entirely only if it's last in the golfer's practice order.
  // Auto-trim only when time is genuinely tight for the number of areas in play. 45 min across
  // all 8 areas is tight; 45 min on driver alone is not, so a focused session isn't cut down.
  const reduced = !!state.reducedMode || total <= Math.min(45, 6*ranking.length);
  const bunkerLast = order.length && order[order.length-1]==='bunker';
  // Every area starts at 1 drill. Extra drills are then handed out from a budget, always to
  // the areas the golfer needs MOST first (ranking order), so extra time thickens the top of
  // their list and less time trims the bottom.
  //  · The budget starts from handicap — a scratch player can spread across 2 drills per area,
  //    a higher handicap gets a tighter, more focused session.
  //  · Every 15 min above their normal session length adds one more drill; every 15 min below
  //    removes one.
  const spreadAreas = ranking.filter(a=> a!=='bunker' && a!=='mid_irons' && a!=='long_irons');
  const singleAreas = ranking.filter(a=> a==='bunker' || a==='mid_irons' || a==='long_irons');
  // Upgrade ladder: give everything a 2nd drill, then bunker/irons theirs, then stack 3rd, 4th
  // and 5th drills. The deep rungs only get reached when the session is focused on a couple of
  // areas (or is very long), which is exactly when you want more drills in the same area.
  const upgrades = spreadAreas.map(a=>[a,2])
    .concat(singleAreas.map(a=>[a,2]))
    .concat(spreadAreas.map(a=>[a,3])).concat(singleAreas.map(a=>[a,3]))
    .concat(spreadAreas.map(a=>[a,4])).concat(singleAreas.map(a=>[a,4]))
    .concat(spreadAreas.map(a=>[a,5])).concat(singleAreas.map(a=>[a,5]));
  const fullRef = profile.sessionLength || 105;
  const steps = Math.round((total - fullRef)/15);
  let budget = reduced ? 0 : Math.max(0, extraDrillBudget(profile) + steps);
  const counts = {}; ranking.forEach(a=>{ counts[a]=1; });
  for(let i=0; i<upgrades.length && budget>0; i++){ counts[upgrades[i][0]] = upgrades[i][1]; budget--; }
  const items = [];
  order.forEach(areaId=>{
    if(reduced && areaId==='bunker' && bunkerLast) return;
    let m = minutesPerArea[areaId];
    if(areaId===profile.startArea) m = Math.max(m,10);
    let pool = filterByDifficulty(allDrills().filter(d=>d.area===areaId && !d.fixed && !d.performance), profile);
    if(!pool.length) return;
    if(excludeIds && excludeIds.length){ const fresh=pool.filter(d=>!excludeIds.includes(d.id)); if(fresh.length) pool=fresh; }
    const favs = pool.filter(d=>favorites.includes(d.id));
    const rest = pool.filter(d=>!favorites.includes(d.id)).sort(()=>rand()-0.5);
    let numDrills = Math.min(counts[areaId] || 1, pool.length);
    let chosen = [...favs, ...rest].slice(0,numDrills);
    // A tempo drill is a warm-up for the rest of the block, so it always leads its section.
    chosen = chosen.slice().sort((a,b)=> (isTempoDrill(b)?1:0) - (isTempoDrill(a)?1:0));
    if(areaId==='putting') items.push({key:'calib_putting',area:'putting',drillId:'putt_calibration',minutes:10,fixed:true});
    const perDrillMin = Math.max(5, Math.round((m||numDrills*8)/numDrills));
    chosen.forEach(d=> items.push({key:areaId+'_'+d.id, area:areaId, drillId:d.id, minutes:perDrillMin, fixed:false}));
  });
  if(!items.length){ const top=ranking[0]; const pool=allDrills().filter(d=>d.area===top&&!d.fixed&&!d.performance); if(pool.length) items.push({key:top+'_'+pool[0].id,area:top,drillId:pool[0].id,minutes:total,fixed:false}); }
  // Rescale the per-drill minutes so the section time break-ups actually add up to the session
  // length the golfer chose. Fixed items (the putting calibration) keep their set time, and no
  // drill is allowed to drop below 5 minutes.
  (function balanceMinutes(){
    const flex = items.filter(i=>!i.fixed);
    if(!flex.length) return;
    const fixedMin = items.filter(i=>i.fixed).reduce((s,i)=>s+i.minutes,0);
    let budgetMin = total - fixedMin;
    const floor = 5;
    if(budgetMin < flex.length*floor){ flex.forEach(i=>{ i.minutes = floor; }); return; }
    const scale = budgetMin / flex.reduce((s,i)=>s+i.minutes,0);
    let used = 0;
    flex.forEach(i=>{ i.minutes = Math.max(floor, Math.round(i.minutes*scale)); used += i.minutes; });
    // hand any rounding remainder to the drill in the area they need most
    let diff = budgetMin - used;
    for(let pass=0; diff!==0 && pass<flex.length*3; pass++){
      const i = flex[pass % flex.length];
      if(diff>0){ i.minutes++; diff--; }
      else if(i.minutes>floor){ i.minutes--; diff++; }
    }
  })();
  // performance drills — kept out of the main session, shown in the Performance section (weakest areas first, up to 3)
  const perfDrills = [];
  ranking.forEach(areaId=>{
    if(perfDrills.length>=3) return;
    let ppool = filterByDifficulty(allDrills().filter(d=>d.area===areaId && d.performance && !d.fixed), profile);
    if(excludeIds && excludeIds.length){ const fresh=ppool.filter(d=>!excludeIds.includes(d.id)); if(fresh.length) ppool=fresh; }
    if(ppool.length){ const pick=ppool[Math.floor(rand()*ppool.length)]; perfDrills.push({key:'perf_'+pick.id, area:areaId, drillId:pick.id}); }
  });
  perfDrills.sort((a,b)=>order.indexOf(a.area)-order.indexOf(b.area));   // show in the golfer's preferred practice order
  const games = selectTodayGames(favorites, rand);
  (state.swingWork||[]).filter(s=>s.autoAdd).forEach(s=>{ items.push({key:'sw_'+s.id, area:s.area, drillId:'sw_'+s.id, minutes:10, fixed:false, swingWork:true}); });
  return {date:dateStr, minutes:total, salt:salt||'', items, perfDrills, games, mode:'auto'};
}
function totalPracticeMinutes(){ const m=state.completions.reduce((s,c)=>s+(c.minutes||0),0); const h=Math.floor(m/60), r=m%60; return h?`${h}h ${r}m`:`${m}m`; }
function computeStreak(){
  const dates = new Set(state.completions.map(c=>c.date));
  let streak=0; const d=new Date();
  if(!dates.has(todayStr())) d.setDate(d.getDate()-1);
  while(true){ const ds=d.toISOString().slice(0,10); if(dates.has(ds)){streak++; d.setDate(d.getDate()-1);} else break; }
  return streak;
}

/* Tick a whole block off at once — handy in an untimed session where you work an area

async function toggleSection(areaId){
  ensureTodayPlan();

  if(!items.length) return;
  const t = todayStr();
  const isDone = i => state.completions.some(c=>c.date===t && c.drillId===i.drillId);
  const allDone = items.every(isDone);
  if(allDone){
    for(const i of items){ if(isDone(i)) await toggleComplete(i.drillId); }
    render();
    return;
  }
  // Checking the block off: share the time since the last check-off evenly between the
  // drills being ticked, so one doesn't swallow the whole gap and the rest read 0:00.
  const toDo = items.filter(i=>!isDone(i));
  const st = state.profile && state.profile.sessionTimer;
  let share = null;
  if(st){
    const nowSecs = st.running ? Math.floor((Date.now()-st.start)/1000) : st.elapsed;
    const gap = Math.max(0, nowSecs - (st.lastMark||0));
    share = Math.round(gap / toDo.length);
  }
  for(const i of toDo) await toggleComplete(i.drillId);
  if(share!=null){
    toDo.forEach(i=>{
      const c = state.completions.find(x=>x.date===t && x.drillId===i.drillId);
      if(c) c.tookSeconds = share;
    });
    await persistActivity();
  }
  render();
}
async function toggleComplete(drillId, loggedMinutes, loggedSeconds){ const t=todayStr(); const idx=state.completions.findIndex(c=>c.date===t&&c.drillId===drillId);
  const wasComplete = idx>=0;
  if(idx>=0){
    // Un-checking. Stash the entry exactly as it was, plus the timing baseline, so that an
    // accidental tap can be undone without losing the time that was already recorded.
    const removed = state.completions[idx];
    const st = state.profile && state.profile.sessionTimer;
    state.undoStash = {drillId, date:t, entry:Object.assign({}, removed), lastMark: st?st.lastMark:null, at:Date.now()};
    if(st && removed && removed.tookSeconds!=null && st.lastMark!=null){ st.lastMark = Math.max(0, st.lastMark - removed.tookSeconds); await persistProfile(); }
    state.completions.splice(idx,1);
  }
  else {
    // Re-ticking a drill you just un-ticked by mistake: put back the original entry and its
    // original time, instead of re-measuring from the stopwatch (which would inflate it).
    const stash = state.undoStash;
    if(loggedSeconds==null && loggedMinutes==null && stash && stash.drillId===drillId && stash.date===t && (Date.now()-stash.at) < 300000){
      state.completions.push(Object.assign({}, stash.entry));
      const st = state.profile && state.profile.sessionTimer;
      if(st && stash.lastMark!=null){ st.lastMark = stash.lastMark; await persistProfile(); }
      state.undoStash = null;
      await persistActivity(); render();
      return;
    }
    const mins = (loggedMinutes!=null?loggedMinutes:null);
    // How long this drill took. Two ways to get it: the drill's own timer (which passes the
    // seconds in directly), or — if you just tick a drill off — the gap on the session
    // stopwatch since the last check-off. Either way it's shown, never added to logged time.
    let tookSeconds = null;
    const st = state.profile && state.profile.sessionTimer;
    if(loggedSeconds!=null){
      tookSeconds = loggedSeconds;
      if(st){ st.lastMark = st.running ? Math.floor((Date.now()-st.start)/1000) : st.elapsed; await persistProfile(); }
    } else if(st){
      const nowSecs = st.running ? Math.floor((Date.now()-st.start)/1000) : st.elapsed;
      tookSeconds = Math.max(0, nowSecs - (st.lastMark||0));
      st.lastMark = nowSecs;
      await persistProfile();
    }
    state.undoStash = null;
    state.completions.push({date:t, drillId, minutes:mins, seconds:loggedSeconds!=null?loggedSeconds:(loggedMinutes!=null?loggedMinutes*60:null), logged: loggedMinutes!=null, tookSeconds});
  }
  await persistActivity(); render();
  if(!wasComplete && state.planCache && state.planCache.date===t){
    const allDone = state.planCache.items.every(it=>state.completions.some(c=>c.date===t&&c.drillId===it.drillId));
    if(allDone && confirm('Nice work — you finished all your drills! Want more?')) await addMoreDrills();
  }
}

/* When you add a drill that shares an area with one already in today's plan,
   ask whether to swap it in for an existing drill or just add it on top. */
async function requestAddDrill(drillId){
  ensureTodayPlan();
  const d = allDrills().find(x=>x.id===drillId); if(!d) return;
  if(state.planCache.items.some(i=>i.drillId===drillId)){ setToast('Already in plan'); return; }
  const sameArea = state.planCache.items.filter(i=>i.area===d.area && !i.fixed);
  if(!sameArea.length){ await addDrillExtra(d); return; }
  const names = sameArea.map((i,idx)=>{ const dd=allDrills().find(x=>x.id===i.drillId); return (idx+1)+'. '+(dd?dd.name:i.drillId); }).join('\n');
  const choice = prompt(`Add "${d.name}" to today?\n\nType the number of the ${areaLabel(d.area)} drill it should REPLACE:\n${names}\n\nOr leave this blank and press OK to add it as an extra drill instead.`, '');
  if(choice===null) return; // cancelled
  const num = parseInt(choice, 10);
  if(!isNaN(num) && num>=1 && num<=sameArea.length){
    const target = sameArea[num-1];
    state.planCache.items = state.planCache.items.map(i=> i.key===target.key ? {key:'added_'+d.id+'_'+Date.now(), area:d.area, drillId:d.id, minutes:i.minutes, fixed:false} : i);
    await sSet('plan-cache', state.planCache); setToast('Replaced'); render();
  } else {
    await addDrillExtra(d);
  }
}

async function addMoreDrills(areaIds){

    if(!pool.length) continue;
    const pick = pool[Math.floor(Math.random()*pool.length)];
    plan.items.push({key:'added_'+pick.id+'_'+Date.now()+'_'+added, area:areaId, drillId:pick.id, minutes:10, fixed:false});
    inPlan.add(pick.id); added++;
  }
  if(!added){ setToast('No more drills left in those areas'); return; }
  state.reducedMode=false; state.moreDrillsOpen=false;
  await sSet('plan-cache', plan);
  setToast('Added '+added+' drill'+(added===1?'':'s')); render();
}

/* Type in how long a drill took, for when you forgot to check it off while practising. */
async function logDrillTime(drillId){
  const t = todayStr();
  const existing = state.completions.find(c=>c.date===t && c.drillId===drillId);
  const cur = existing ? String(existing.tookSeconds!=null ? Math.max(1,Math.round(existing.tookSeconds/60)) : (existing.minutes||'')) : '';
  const v = prompt('How many minutes did this drill take?', cur);
  if(v===null) return;
  const n = parseFloat(v);
  if(isNaN(n) || n<=0){ setToast('Enter a number of minutes'); return; }
  const mins = Math.max(1, Math.round(n)), secs = Math.round(n*60);
  if(existing){
    existing.minutes=mins; existing.seconds=secs; existing.tookSeconds=secs; existing.logged=true;
    await persistActivity(); render();
  } else {
    await toggleComplete(drillId, mins, secs);
  }
}

async function rebuildForFocus(msg){
  // Anything already ticked off today stays in the plan — you've done the work, it shouldn't vanish.
  const keep = (state.planCache && state.planCache.items || []).filter(i=>
    state.completions.some(c=>c.date===todayStr() && c.drillId===i.drillId));
  state.planCache = computePlan(todayStr(), state.todayMinutes||state.profile.sessionLength, String(Date.now()), []);
  const have = new Set(state.planCache.items.map(i=>i.drillId));
  state.planCache.items = keep.filter(i=>!have.has(i.drillId)).concat(state.planCache.items);
  markPlanSeen(state.planCache);
  await sSet('plan-cache', state.planCache);
  await sSet('focus-areas', state.focusAreas || null);
  state.focusPanelOpen = false;
  if(msg) setToast(msg); else render();
}

  // picking everything is the same as no filter at all
  state.focusAreas = picked.length===AREAS.length ? null : picked;
  await rebuildForFocus(state.focusAreas ? null : 'Back to your full plan');

async function swapSelected(){
  const rand = mulberry32(Date.now()>>>0);
  state.planCache.items = state.planCache.items.map(item=>{
    if(!state.swapSelection.has(item.key)||item.fixed) return item;
    const used = state.planCache.items.map(i=>i.drillId);
    const pool = allDrills().filter(d=>d.area===item.area && !d.fixed && !used.includes(d.id));
    if(!pool.length) return item;
    const pick = pool[Math.floor(rand()*pool.length)];
    return {...item, drillId:pick.id, key:item.area+'_'+pick.id};
  });
  await sSet('plan-cache', state.planCache);
  state.swapMode=false; state.swapSelection=new Set(); render();
}

async function swapSelectedGames(){
  const rand = mulberry32(Date.now()>>>0);
  const current = state.planCache.games||[];
  state.planCache.games = current.map(id=>{
    if(!state.gameSwapSelection.has(id)) return id;
    const g = findGame(id);
    const pool = (g && g.performance ? ALL_GAMES.filter(x=>x.performance) : GAMES).filter(x=>x.id!==id && !current.includes(x.id));
    if(!pool.length) return id;
    return pool[Math.floor(rand()*pool.length)].id;
  });
  await sSet('plan-cache', state.planCache);
  state.gameSwapMode=false; state.gameSwapSelection=new Set(); render();
}

    <h2 style="margin-top:26px;font-size:20px">${isOnboarding?"2. ":""}How do you like to start practice?</h2>
    <p class="muted" style="margin-top:2px;font-size:14px">Use the arrows to set the order you warm up through. Your plan follows this flow.</p>
    <div style="margin-top:10px">${startRows}</div>
    <h2 style="margin-top:26px;font-size:20px">${isOnboarding?"3. ":""}Rank what to work on</h2>
    <p class="muted" style="margin-top:2px;font-size:14px">Use the arrows. Most work needed goes at #1.</p>
    <div style="margin-top:10px">${rankRows}</div>
    <button class="btn ${isOnboarding?'bigbtn':''}" style="margin-top:18px" onclick="saveProfileForm()">${isOnboarding?'Build My First Plan →':'Save Changes'}</button>
  `;
}

      <div style="margin-left:12px"><strong style="font-size:18px">${escapeHtml(p.displayName)}</strong><br><span class="muted">${currentUser?escapeHtml(currentUser.email):'Local profile'}</span></div>

    <div class="statsrow">
      <div><div class="statnum">${computeStreak()}🔥</div><div class="statlabel">Streak</div></div>

      <div><div class="statnum">${state.favorites.length}</div><div class="statlabel">Favorites</div></div>

    <div class="inforow"><span>Commitment</span><span>${COMMIT_LABEL[p.commitment||'regular']}</span></div>
    <div class="inforow"><span>Practice notifications</span>
      <button class="btn small ${p.notifications?'':'secondary'}" onclick="toggleNotifications()">${p.notifications?'On':'Off'}</button></div>
    <div class="inforow"><span>Dominant hand</span><span>${p.hand==='L'?'Left':'Right'}</span></div>
    <div class="inforow"><span>Session mode</span><span>${p.sessionMode==='untimed'?'Untimed':'Timed · '+p.sessionLength+' min'}</span></div>
