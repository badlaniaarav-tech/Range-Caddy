<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Range Caddy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Range Caddy">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F5233">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');
:root{--ink:#16281D;--fairway:#2F5233;--fairway-light:#4C7A52;--chalk:#F6F4EC;--paper:#FFFFFF;--flag:#C99A4B;--flag-dark:#A67B33;--slate:#3F6B45;--line:#E1DDD0;--danger:#B3462C;}
*{box-sizing:border-box;}
svg{vertical-align:middle;flex-shrink:0;}
html,body{margin:0;}
body{background:#EDEAE0;font-family:'Inter',sans-serif;color:var(--ink);}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:#EDEAE0 url('background.png') center/cover no-repeat;}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:transparent;display:flex;flex-direction:column;}
#content{flex:1;padding:20px 18px 26px;overflow-y:auto;}
.navbar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px 20px;background:transparent;}
.navpill{display:flex;align-items:center;gap:2px;background:var(--ink);border-radius:999px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.35);}
.navbtn{background:none;border:none;cursor:pointer;padding:11px 17px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);}
.navbtn.active{background:rgba(255,255,255,.16);color:#fff;}
.navicon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.navavatarbtn{width:44px;height:44px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;background:var(--flag);color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.3);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.navavatarbtn.active{border-color:var(--fairway);}
.navavatarbtn img{width:100%;height:100%;object-fit:cover;display:block;}
h1,h2,h3{font-family:'Inter',sans-serif;font-weight:900;letter-spacing:-0.01em;margin:0 0 4px;color:#000;text-shadow:0 0 6px rgba(255,255,255,.9),0 0 14px rgba(255,255,255,.7);}
h1{font-size:25px;}
h2{font-size:17px;}
p{margin:0 0 8px;line-height:1.45;}
.muted{color:#000;font-weight:600;font-size:13px;text-shadow:0 0 5px rgba(255,255,255,.9),0 0 10px rgba(255,255,255,.6);}
.num{font-family:'JetBrains Mono',monospace;font-weight:600;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px;}
.card.focus{border-left:4px solid var(--flag);}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pill{display:inline-block;background:var(--fairway);color:var(--chalk);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;}
.perfbadge{display:inline-block;background:var(--flag);color:var(--ink);font-size:10.5px;font-weight:700;padding:2px 8px 2px 6px;border-radius:20px;margin-left:6px;vertical-align:middle;white-space:nowrap;}
.eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fairway);font-weight:600;}
.btn{font-family:'Inter',sans-serif;font-weight:700;font-size:15px;background:var(--fairway);color:var(--chalk);border:none;border-radius:14px;padding:13px 16px;cursor:pointer;width:100%;}
.btn:active{background:var(--fairway-light);}
.btn.secondary{background:var(--paper);color:var(--fairway);border:1.5px solid var(--fairway);}
.btn.danger{background:var(--danger);}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px;}
label{display:block;font-size:11.5px;color:#000;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 5px;font-family:'Barlow Condensed',sans-serif;}
input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font-family:'Inter';font-size:14px;background:var(--paper);color:var(--ink);}
textarea{resize:vertical;min-height:50px;}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);font-family:'Inter';}
.chip.active{background:var(--fairway);color:var(--chalk);border-color:var(--fairway);}
.rankrow2{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px 16px 15px 13px;margin-bottom:11px;box-shadow:0 2px 6px rgba(22,40,29,.08);}
.rankbadge{width:36px;height:36px;border-radius:50%;background:var(--fairway);color:var(--chalk);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:18px;flex-shrink:0;}
.rankicon{width:44px;height:44px;border-radius:50%;background:var(--chalk);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
.rankname{flex:1;font-weight:700;font-size:17px;}
.rankgrip{display:none;}
.rankarrows{display:flex;gap:6px;flex-shrink:0;}
.rankarrows button{width:44px;height:44px;border-radius:50%;border:none;background:var(--chalk);cursor:pointer;color:var(--fairway);font-size:18px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line);transition:background .1s;}
.rankarrows button:active{background:var(--fairway);color:var(--chalk);}
.rankarrows button:disabled{opacity:.3;cursor:default;background:var(--chalk);color:var(--fairway);}
.divider{border:none;border-top:1px dashed var(--line);margin:16px 0;}
.starbtn{background:none;border:none;font-size:17px;cursor:pointer;color:var(--flag);}
.tabs{display:flex;background:var(--line);border-radius:22px;padding:4px;gap:4px;margin-bottom:14px;}
.tabbtn{flex:1;padding:10px;border-radius:18px;border:none;background:transparent;color:var(--slate);font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Inter';}
.tabbtn.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--chalk);padding:9px 18px;border-radius:20px;font-size:13px;z-index:50;}
.empty{text-align:center;padding:28px 10px;color:var(--slate);}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--flag);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:19px;flex-shrink:0;}
.statsrow{display:flex;justify-content:space-around;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.statnum{font-family:'Barlow Condensed';font-weight:700;font-size:20px;text-align:center;}
.statlabel{font-size:11px;color:var(--slate);text-align:center;text-transform:uppercase;letter-spacing:.04em;}
.inforow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
.inforow:last-child{border-bottom:none;}
.checkcircle{width:25px;height:25px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--chalk);font-size:13px;}
.checkcircle.done{background:var(--fairway);border-color:var(--fairway);}
.reps{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--fairway);font-weight:700;margin:5px 0;}
.linkbtn{color:#000;font-size:13px;font-weight:800;cursor:pointer;background:none;border:none;padding:0;font-family:'Inter';text-shadow:0 0 5px rgba(255,255,255,.9),0 0 10px rgba(255,255,255,.6);}
.linkback{background:none;border:none;color:#000;font-weight:800;font-size:13px;cursor:pointer;padding:0;margin-bottom:10px;text-shadow:0 0 5px rgba(255,255,255,.9),0 0 10px rgba(255,255,255,.6);}
</style>
</head>
<body>
<div id="app">
  <div id="content"><div class="empty">Loading your bag…</div></div>
  <div class="navbar" id="navbar"></div>
</div>
<script>
/* ---------- data ---------- */
const AREAS = [
 {id:'putting', label:'Putting'},{id:'chipping', label:'Chipping'},
 {id:'bunker', label:'Bunker'},{id:'wedges_pitching', label:'Wedges / Pitching'},
 {id:'short_irons', label:'Short Irons'},{id:'mid_irons', label:'Mid Irons'},
 {id:'long_irons', label:'Long Irons'},{id:'driver_woods', label:'Driver / Woods'}
];
const AREA_SHORT = {driver_woods:'Driver',long_irons:'Long irons',mid_irons:'Mid irons',short_irons:'Short irons',wedges_pitching:'Wedges',chipping:'Chipping',putting:'Putting',bunker:'Bunker'};
const AREA_ICON = {
  driver_woods:'🏌️',
  long_irons:`<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="var(--fairway)"/><path d="M12 11 L9 20 H15 Z" fill="var(--fairway)" opacity=".55"/><line x1="6" y1="20" x2="18" y2="20" stroke="var(--fairway)" stroke-width="2" stroke-linecap="round"/></svg>`,
  mid_irons:`<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="var(--chalk)" stroke="var(--ink)" stroke-width="1.5"/><circle cx="9" cy="9" r="1" fill="var(--ink)"/><circle cx="15" cy="9" r="1" fill="var(--ink)"/><circle cx="12" cy="12" r="1" fill="var(--ink)"/><circle cx="9" cy="15" r="1" fill="var(--ink)"/><circle cx="15" cy="15" r="1" fill="var(--ink)"/></svg>`,
  short_irons:`<svg width="18" height="18" viewBox="0 0 24 24"><line x1="6" y1="21" x2="6" y2="4" stroke="var(--fairway)" stroke-width="2" stroke-linecap="round"/><path d="M6 4 L17 7 L6 10 Z" fill="var(--danger)"/></svg>`,
  wedges_pitching:`<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="var(--danger)"/><circle cx="12" cy="12" r="6" fill="var(--chalk)"/><circle cx="12" cy="12" r="3" fill="var(--danger)"/></svg>`,
  chipping:`<svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 18c2-1 4-1 6 0s4 1 6 0s4-1 4 0" stroke="var(--fairway)" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="9" cy="8" r="3" fill="var(--ink)"/><path d="M9 11 Q14 6 19 10" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/></svg>`,
  putting:'⛳',
  bunker:'🏖️'
};
const ICON_HOME = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4h4v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>`;
const ICON_LIBRARY = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>`;
const ICON_TROPHY = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a2 2 0 0 0 0 4h1.5M17 5h3a2 2 0 0 1 0 4h-1.5"/><path d="M12 14v3"/><path d="M9 21h6"/><path d="M9.5 17h5l.5 4H9l.5-4Z"/></svg>`;
const ICON_PERSON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>`;
const ICON_CAMERA = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-2h7l1 2H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
const areaLabel = id => (AREAS.find(a=>a.id===id)||{}).label || id;

const DRILLS = [
{id:'putt_calibration',area:'putting',fixed:true,name:'Stroke Calibration',description:"Calibrate your putting stroke with a Visio putting mat, a putting mirror, or David Pelz's Putting Tutor.",setup:'Use a putting mirror, Visio putting mat, or Putting Tutor (lay a towel down first to protect the green).',repsOrTime:'5 min',success:'Consistent face angle and path at impact',difficulty:'Beginner'},
{id:'p1',area:'putting',name:'4-6 Redemption',description:'Build pressure with a ring of short putts and one bail-out putt per corner.',setup:'Tees at 4 ft and 6 ft around the hole; add a 9 ft "redemption" tee at each corner.',repsOrTime:'1-2 balls per tee, work around the hole',success:'Clear every tee, using each redemption putt at most once',difficulty:'Intermediate'},
{id:'p2',area:'putting',name:'3-5-7 Ladder',description:'Climb back from the hole only after proving you can make a short one.',setup:'Tees at 3, 5 and 7 ft.',repsOrTime:'2-3 makes in a row per distance before moving back',success:'2-3 in a row at each distance',difficulty:'Beginner'},
{id:'p3',area:'putting',name:'16-Putt Gauntlet',description:'A volume short-putt test from four sides of the hole plus two longer pressure putts.',setup:'14 tees at 3-5 ft around the hole, plus two 8 ft putts.',repsOrTime:'1 ball per tee, 16 putts total',success:'Make 13 of 16',difficulty:'Advanced'},
{id:'p4',area:'putting',name:'10-12-15 Redemption',description:'Mid-range putts where a good miss still counts for something.',setup:'Tees at 10, 12 and 15 ft at each corner.',repsOrTime:'4 putts total',success:'4 makes, no miss finishes more than 3 ft past the hole',difficulty:'Intermediate'},
{id:'p5',area:'putting',name:'Lag Ladder',description:'Dial in speed control on long putts using a gate to land in.',setup:'Alignment stick 3 ft behind the cup; putt from 10, 20, 30, 40 ft.',repsOrTime:'3 putts per distance',success:'3 in a row finishing between the hole and the stick at each distance',difficulty:'Advanced'},
{id:'p6',area:'putting',name:'4-5-6 Performance',performance:true,description:'A scored short-putt circuit to track as a baseline.',setup:'Tees at 4, 5 and 6 ft around the hole (4ft at each corner, 5ft behind each 4ft, 6ft at four tees).',repsOrTime:'3 balls per 4ft tee, 2 per 5ft tee, 1 per 6ft tee — 22 putts total',success:'Make as many of the 22 as possible; track and beat your best',difficulty:'Intermediate'},
{id:'p7',area:'putting',name:'Closer',performance:true,description:'A strokes-gained style test that mimics finishing off a round.',setup:'One ball each from 9, 12, 15, 18, 21, 18, 15, 12, 9 ft.',repsOrTime:'9 putts',success:'Make at least 3 of 9 to gain strokes on the field',difficulty:'Advanced'},
{id:'p8',area:'putting',name:'7-Ball Performance Game',performance:true,description:'Test how many you can make across a spread of distances.',setup:'Pick 7 different distances around a hole.',repsOrTime:'1 ball at each of the 7 distances',success:'Make as many as possible — tour average over multiple rounds is 4 of 7',difficulty:'Intermediate'},
{id:'p9',area:'putting',name:'3-10ft Number Circuit',performance:true,description:'A random-order pressure loop that mimics never getting the same putt twice.',setup:'10 numbered tees (1-10) placed in random order at any distance from 3-8 ft around one hole.',repsOrTime:'Putt in numeric order 1 through 10',success:'Make all 10 in order; one redemption putt allowed at the tee you missed',difficulty:'Advanced'},
{id:'p10',area:'putting',name:'3-6-9 In A Row',performance:true,description:'A make-everything line drill building confidence from three distances.',setup:'Set balls in a line at 3, 6 and 9 ft.',repsOrTime:'9 putts (3 from each distance)',success:'Make all 9 in a row',difficulty:'Advanced'},
{id:'c1',area:'chipping',name:'Towel Landing',description:'Train your landing spot instead of the hole.',setup:'Lay a towel at your intended landing spot for each distance.',repsOrTime:'5 balls per landing spot',success:'3 of 5 land on the towel',difficulty:'Beginner'},
{id:'c2',area:'chipping',name:'Up & Down Challenge',description:'Classic scrambling test from mixed lies.',setup:'Ten balls scattered around the green.',repsOrTime:'10 chips',success:'Get up and down 6+ times',difficulty:'Intermediate'},
{id:'c3',area:'chipping',name:'Trajectory Control',description:'Prove you can flight it three ways to the same hole.',setup:'One target hole.',repsOrTime:'5 low, 5 medium, 5 high shots',success:'All three trajectories finish inside a consistent radius',difficulty:'Intermediate'},
{id:'c4',area:'chipping',name:'One-Club Challenge',description:'Build shot-making touch with a single wedge.',setup:'One wedge, three different targets.',repsOrTime:'Low, medium and high shot to each target',success:'Land all three trajectories on each target',difficulty:'Advanced'},
{id:'c5',area:'chipping',name:'Par 18',description:'Turn chipping into a scored 9-hole round.',setup:'Pick 9 different chip shots, each a par 2.',repsOrTime:'9 chips, 2 putts max per hole',success:'Beat your own par (18)',difficulty:'Intermediate'},
{id:'c6',area:'chipping',name:'Must Makes',performance:true,description:'A volume chipping test — make a few out of many under fatigue.',setup:'Pick a hole about 20 ft in front of you; grab 20 balls.',repsOrTime:'20 chips',success:'Make at least 3 of 20 to finish',difficulty:'Intermediate'},
{id:'c7',area:'chipping',name:'Low, Mid, High Up & Down',performance:true,description:'Prove you can flight it three ways and get up and down from each.',setup:'Pin about 30 ft / 10 yds away.',repsOrTime:'One low, one mid, one high chip',success:'Get all 3 up and down, in a row',difficulty:'Advanced'},
{id:'c8',area:'chipping',name:'Chipping Ladder',performance:true,description:'Land the ball in progressively deeper zones and back down without a miss.',setup:'Place a club or alignment stick every 3 ft from 10 ft out to 22 ft.',repsOrTime:'Land a ball in every zone, going up and back down the ladder',success:'Complete the full ladder; any miss restarts you',difficulty:'Advanced'},
{id:'w1',area:'wedges_pitching',name:'Yardage Ladder',description:'Build feel for controlling distance with one club.',setup:'Pick one wedge and 4-5 increasing yardages (e.g. 80-120 in 10yd steps).',repsOrTime:'1 ball per yardage, in order',success:'Complete the ladder without missing a yardage badly',difficulty:'Intermediate'},
{id:'w2',area:'wedges_pitching',name:'Three Swings, One Club',description:'Learn three distances off one swing.',setup:'One wedge; half, three-quarter and full swing lengths.',repsOrTime:'5 balls per swing length',success:'Consistent, repeatable yardage gaps between the three lengths',difficulty:'Intermediate'},
{id:'w3',area:'wedges_pitching',name:'Trajectory Windows',description:'Same yardage, three different ball flights.',setup:'One target yardage.',repsOrTime:'5 balls each at low, standard and high flight',success:'All three flights finish within your target radius',difficulty:'Advanced'},
{id:'b1',area:'bunker',name:'Line Drill',description:'Groove a consistent entry point before you hit a ball for real.',setup:'Draw a line in the sand; take a practice swing brushing the same spot between shots.',repsOrTime:'10 shots, practice swing between each',success:'Consistent entry point and clean contact',difficulty:'Beginner'},
{id:'b2',area:'bunker',name:'Leapfrog',description:'Build feel for speed and distance control out of sand.',setup:'Any bunker with room to vary distance.',repsOrTime:'Each shot must finish farther than the last',success:'Set a new personal-record distance streak',difficulty:'Intermediate'},
{id:'b3',area:'bunker',name:'Club Comparison',description:'Feel how loft changes trajectory and spin from the same lie.',setup:'PW through your lob wedge, same lie and target.',repsOrTime:'3 balls per club',success:'Notice and describe the trajectory difference between clubs',difficulty:'Intermediate'},
{id:'d1',area:'driver_woods',name:'Stock Shot Reps',description:'Repeat your stock shot shape until it is boring.',setup:'Pick one target line and shot shape.',repsOrTime:'10 balls',success:'7+ finish within your target shot shape',difficulty:'Beginner'},
{id:'d2',area:'driver_woods',name:'Max Speed Block',description:'A focused block to train and measure clubhead speed.',setup:'Full warm-up first; driver only.',repsOrTime:'5-8 swings at effort, resting between',success:'Track best speed/carry and note the trend over time',difficulty:'Intermediate'},
{id:'d3',area:'driver_woods',name:'Thrive for 5',description:'A pressure test that mimics needing to find fairways on the course.',setup:'Pick a realistic fairway target width.',repsOrTime:'Hit tee shots until you string 5 in a row',success:'5 consecutive tee shots that would find the fairway',difficulty:'Advanced'},
{id:'d4',area:'driver_woods',name:'Fairway Wood Finder',description:'Build a flighted, controlled fairway wood you can trust off the deck or tee.',setup:'One fairway wood, one target.',repsOrTime:'10 balls',success:'Consistent, controlled trajectory and start line',difficulty:'Intermediate'},
{id:'d5',area:'driver_woods',name:'Five-Shape Fairway',performance:true,description:'Shape the ball five ways and keep every one in play — real course variety.',setup:'Pick two pins and use the gap between them as your fairway.',repsOrTime:'5 balls: 1 low, 1 stock, 1 draw, 1 fade, 1 high',success:'All 5 finish in the fairway',difficulty:'Advanced'},
{id:'li1',area:'long_irons',name:'Solid Stock Shot',description:'Prioritize center strike over distance.',setup:'One long iron, one target.',repsOrTime:'10 balls',success:'7+ centered strikes',difficulty:'Intermediate'},
{id:'li2',area:'long_irons',name:'Tempo & Balance',description:'Slow the swing down to speed up your consistency.',setup:'Same club, focus purely on tempo.',repsOrTime:'10 swings, hold finish 3 seconds',success:'Balanced finish held for 3 seconds every swing',difficulty:'Beginner'},
{id:'mi1',area:'mid_irons',name:'Stock Shot Consistency',description:'Track your strike pattern with your bread-and-butter club.',setup:'One mid iron, one target.',repsOrTime:'10 balls',success:'7+ centered strikes',difficulty:'Intermediate'},
{id:'mi2',area:'mid_irons',name:'Tempo Checkpoint',description:'Same balance drill, mid-iron speed.',setup:'One mid iron.',repsOrTime:'10 swings, hold finish 3 seconds',success:'Balanced finish on every swing',difficulty:'Beginner'},
{id:'si1',area:'short_irons',name:'Know Your Numbers',description:'Build a real yardage chart instead of guessing.',setup:'One short iron, 4-5 increasing yardages.',repsOrTime:'1 ball per yardage, log the carry',success:'Yardage log stays within a tight, repeatable range',difficulty:'Intermediate'},
{id:'si2',area:'short_irons',name:'Miss Right, Miss Left',description:'Learn to control your miss instead of hoping for perfect.',setup:'Pick a flag; aim to miss on purpose.',repsOrTime:'3 balls starting right of the flag, 3 starting left',success:'Both intentional misses land inside your target radius',difficulty:'Advanced'},

/* ---------- storage helpers ----------
   window.storage is a bridge some hosts provide; when it's missing (plain
   browser, PWA, or a Capacitor WebView) fall back to localStorage so
   everything still actually persists on-device. */
if(!window.storage){
  window.storage = {
    async get(key, shared){ const raw = localStorage.getItem((shared?'shared:':'')+key); return raw!=null ? {value:raw} : null; },
    async set(key, value, shared){ localStorage.setItem((shared?'shared:':'')+key, value); },
    async delete(key, shared){ localStorage.removeItem((shared?'shared:':'')+key); },
    async list(prefix, shared){ const p=(shared?'shared:':'')+prefix; const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(p)) keys.push(shared?k.slice(7):k); } return {keys}; }
  };
}
async function sGet(key, fallback, shared){ try{ const r = await window.storage.get(key, !!shared); return r ? JSON.parse(r.value) : fallback; }catch(e){ return fallback; } }
async function sSet(key, val, shared){ try{ await window.storage.set(key, JSON.stringify(val), !!shared); }catch(e){ console.error('storage failed', e); } }

/* ---------- state ---------- */
let state = { profile:null, ranking:null, completions:[], favorites:[], customDrills:[], swingWork:[],
  planCache:null, view:'loading', libFilter:'all', toast:null,
  swapMode:false, swapSelection:new Set(), gameSwapMode:false, gameSwapSelection:new Set(), expanded:new Set(), buildSelection:new Set(),
  suggestions:[], suggestionsLoading:false, todayMinutes:null,
  detailDrillId:null, detailFrom:'today', timer:null,
  detailGameId:null, addDrillOpen:false, addDrillArea:'all', gameFilter:'all', addGameOpen:false };

function allDrills(){ const sw=(state.swingWork||[]).map(s=>({id:'sw_'+s.id, area:s.area, name:s.name, description:s.description||'Personal swing work', setup:'Your own notes — from My Swing Work.', repsOrTime:'As needed', success:'Your own goal for this rep.', difficulty:'Personal', swingWork:true}));
  return DRILLS.concat(state.customDrills).concat(sw); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const DIFF_RANK = {Beginner:0, Intermediate:1, Advanced:2};
// base 0-2 tier from handicap number (lower handicap = higher tier)
function handicapTier(hcp){ if(/scratch/i.test(String(hcp))) return 2; const n=parseFloat(String(hcp).replace(/[^\d.\-+]/g,'')); if(isNaN(n)) return 1; if(n<=8) return 2; if(n<=18) return 1; return 0; }
// combine handicap, optional self-reported level, and easier/harder preference into a target tier
function targetTier(profile){ if(!profile) return 1;
  let t = handicapTier(profile.handicap);
  if(profile.skillLevel && profile.skillLevel!=='auto'){ t = {beginner:0,intermediate:1,advanced:2}[profile.skillLevel]; }
  if(profile.difficultyPref==='easier') t-=1; else if(profile.difficultyPref==='harder') t+=1;
  return Math.max(0, Math.min(2, t));
}
// keep drills at/below the target tier; if none, fall back to closest
function filterByDifficulty(pool, profile){ if(!pool.length) return pool; const t=targetTier(profile);
  let ok = pool.filter(d=>(DIFF_RANK[d.difficulty]??1) <= t);
  if(!ok.length) ok = pool.slice().sort((a,b)=>Math.abs((DIFF_RANK[a.difficulty]??1)-t)-Math.abs((DIFF_RANK[b.difficulty]??1)-t));
  return ok;
}

async function persistActivity(){ await sSet('activity', {completions:state.completions, favorites:state.favorites, customDrills:state.customDrills, swingWork:state.swingWork}); }
async function editCompletionTime(idx){ const cur=state.completions[idx]; if(!cur) return;
  const v=prompt('Minutes for this entry (enter a smaller number to remove time):', cur.minutes); if(v===null) return;
  const n=parseFloat(v); if(isNaN(n)||n<0) return;
  if(n===0){ state.completions.splice(idx,1); } else { cur.minutes=n; cur.seconds=Math.round(n*60); }
  await persistActivity(); render();
}
async function removeCompletionEntry(idx){ state.completions.splice(idx,1); await persistActivity(); render(); }
async function persistProfile(){ await sSet('profile', {profile:state.profile, ranking:state.ranking}); }

/* ---------- plan engine ---------- */
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=Math.imul(31,h)+s.charCodeAt(i)|0; } return h>>>0; }
function mulberry32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function selectTodayGames(favorites, rand){
  const pickPool = (pool)=>{ const fav=pool.filter(g=>favorites.includes(g.id)).map(g=>g.id); const rest=pool.filter(g=>!favorites.includes(g.id)).map(g=>g.id).sort(()=>rand()-0.5); return [...fav, ...rest]; };
  const courseGame = pickPool(GAMES)[0];
  const perfGames = pickPool(ALL_GAMES.filter(g=>g.performance && g.id!==courseGame)).slice(0,2);
  return [courseGame, ...perfGames].filter(Boolean);
}
function computePlan(dateStr, minutes, salt, excludeIds){
  const {ranking, profile, favorites} = state;
  const total = minutes;
  const n = ranking.length; const weights={}; let sumW=0;
  ranking.forEach((a,idx)=>{ const w=n-idx; weights[a]=w; sumW+=w; });
  const minutesPerArea={}; let allocated=0;
  ranking.forEach(a=>{ const m=Math.round(total*weights[a]/sumW); minutesPerArea[a]=m; allocated+=m; });
  minutesPerArea[ranking[0]] += (total-allocated);
  const pref = profile.startOrder && profile.startOrder.length ? profile.startOrder : [profile.startArea];
  const order = [...pref, ...ranking.filter(a=>!pref.includes(a))];
  const rand = mulberry32(hashStr(dateStr+'|'+(salt||'')));
  const items = [];
  order.forEach(areaId=>{
    let m = minutesPerArea[areaId];
    if(areaId===profile.startArea) m = Math.max(m,10);
    if(m<5) return;
    let pool = filterByDifficulty(allDrills().filter(d=>d.area===areaId && !d.fixed), profile);
    if(!pool.length) return;
    if(excludeIds && excludeIds.length){ const fresh=pool.filter(d=>!excludeIds.includes(d.id)); if(fresh.length) pool=fresh; }
    const favs = pool.filter(d=>favorites.includes(d.id));
    const rest = pool.filter(d=>!favorites.includes(d.id)).sort(()=>rand()-0.5);
    const numDrills = m>=20?2:1;
    const chosen = [...favs, ...rest].slice(0,numDrills);
    if(areaId==='putting' && areaId===order[0]) items.push({key:'calib_putting',area:'putting',drillId:'putt_calibration',minutes:5,fixed:true});
    chosen.forEach(d=> items.push({key:areaId+'_'+d.id, area:areaId, drillId:d.id, minutes:Math.max(5,Math.round(m/numDrills)), fixed:false}));
  });
  if(!items.length){ const top=ranking[0]; const pool=allDrills().filter(d=>d.area===top&&!d.fixed); if(pool.length) items.push({key:top+'_'+pool[0].id,area:top,drillId:pool[0].id,minutes:total,fixed:false}); }
  const games = selectTodayGames(favorites, rand);
  (state.swingWork||[]).filter(s=>s.autoAdd).forEach(s=>{ items.push({key:'sw_'+s.id, area:s.area, drillId:'sw_'+s.id, minutes:10, fixed:false, swingWork:true}); });
  return {date:dateStr, minutes:total, salt:salt||'', items, games, mode:'auto'};
}
function totalPracticeMinutes(){ const m=state.completions.reduce((s,c)=>s+(c.minutes||0),0); const h=Math.floor(m/60), r=m%60; return h?`${h}h ${r}m`:`${m}m`; }
function computeStreak(){
  const dates = new Set(state.completions.map(c=>c.date));
  let streak=0; const d=new Date();
  if(!dates.has(todayStr())) d.setDate(d.getDate()-1);
  while(true){ const ds=d.toISOString().slice(0,10); if(dates.has(ds)){streak++; d.setDate(d.getDate()-1);} else break; }
  return streak;
}

/* ---------- actions ---------- */
function setToast(msg){ state.toast=msg; render(); setTimeout(()=>{ state.toast=null; const t=document.getElementById('toast'); if(t) t.remove(); }, 1800); }
function plannedMinutesFor(drillId){ if(!state.planCache) return null; const it=state.planCache.items.find(i=>i.drillId===drillId); return it?it.minutes:null; }
async function toggleComplete(drillId, loggedMinutes, loggedSeconds){ const t=todayStr(); const idx=state.completions.findIndex(c=>c.date===t&&c.drillId===drillId);
  const wasComplete = idx>=0;
  if(idx>=0){ state.completions.splice(idx,1); }
  else { const mins = (loggedMinutes!=null?loggedMinutes:plannedMinutesFor(drillId)); state.completions.push({date:t, drillId, minutes:mins, seconds:loggedSeconds!=null?loggedSeconds:(loggedMinutes!=null?loggedMinutes*60:null), logged: loggedMinutes!=null}); }
  await persistActivity(); render();
  if(!wasComplete && state.planCache && state.planCache.date===t){
    const allDone = state.planCache.items.every(it=>state.completions.some(c=>c.date===t&&c.drillId===it.drillId));
    if(allDone && confirm('Nice work — you finished all your drills! Want more?')) await addMoreDrills();
  }
}
async function toggleGameComplete(gameId){ const t=todayStr(); const idx=state.completions.findIndex(c=>c.date===t&&c.drillId===gameId&&c.isGame);
  if(idx>=0){ state.completions.splice(idx,1); }
  else { const g=findGame(gameId); state.completions.push({date:t, drillId:gameId, minutes:null, seconds:null, logged:false, isGame:true, gameName:g?g.name:''}); }
  await persistActivity(); render();
}
async function addMoreDrills(){
  const t=todayStr(); const used = new Set(state.planCache.items.map(i=>i.drillId));
  const added=[];
  for(const areaId of state.ranking){
    const pool = filterByDifficulty(allDrills().filter(d=>d.area===areaId && !d.fixed && !used.has(d.id)), state.profile);
    const favs = pool.filter(d=>state.favorites.includes(d.id));
    const pick = favs[0]||pool[0];
    if(pick){ used.add(pick.id); added.push({key:'more_'+pick.id+'_'+Date.now(), area:areaId, drillId:pick.id, minutes:10, fixed:false}); }
    if(added.length>=3) break;
  }
  state.planCache.items.push(...added);
  await sSet('plan-cache', state.planCache); setToast('Added '+added.length+' more drill'+(added.length===1?'':'s')); render();
}
/* drill detail */
function openDrill(drillId, from){ state.detailDrillId=drillId; state.detailFrom=from||'today'; state.view='drilldetail'; render(); }
function closeDrill(){ stopTimer(true); state.detailDrillId=null; state.view=state.detailFrom||'today'; if(state.view==='today') ensureTodayPlan(); render(); }
/* timer */
function startTimer(){ state.timer={start:Date.now(), elapsed:0}; timerInterval=setInterval(()=>{ if(state.timer){ state.timer.elapsed=Math.floor((Date.now()-state.timer.start)/1000); const el=document.getElementById('timer_display'); if(el) el.textContent=fmtTime(state.timer.elapsed); } },1000); render(); }
function stopTimer(silent){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } if(!silent) render(); }
function fmtTime(s){ const m=Math.floor(s/60), sec=s%60; return m+':'+String(sec).padStart(2,'0'); }
async function finishDrillTimed(){ const secs=state.timer?state.timer.elapsed:0; const mins=Math.max(1,Math.round(secs/60)); stopTimer(true); state.timer=null; await toggleComplete(state.detailDrillId, mins, secs); setToast('Logged '+fmtTime(secs)); closeDrill(); }
/* session-level timer (whole practice) */
function startSessionTimer(){ if(!state.profile) return; const prev=state.profile.sessionTimer; const base=(prev&&!prev.running)?prev.elapsed:0;
  state.profile.sessionTimer={start:Date.now()-base*1000, elapsed:base, running:true};
  sessionInterval=setInterval(()=>{ const st=state.profile.sessionTimer; if(st&&st.running){ st.elapsed=Math.floor((Date.now()-st.start)/1000); const el=document.getElementById('session_timer'); if(el) el.textContent=fmtTime(st.elapsed); } },1000); render(); }
function pauseSessionTimer(){ const st=state.profile.sessionTimer; if(st){ st.elapsed=Math.floor((Date.now()-st.start)/1000); st.running=false; } if(sessionInterval){clearInterval(sessionInterval);sessionInterval=null;} render(); }
async function logSessionTimer(){ const st=state.profile.sessionTimer; if(!st) return; const secs=st.running?Math.floor((Date.now()-st.start)/1000):st.elapsed; const mins=Math.max(1,Math.round(secs/60));
  if(sessionInterval){clearInterval(sessionInterval);sessionInterval=null;}
  state.completions.push({date:todayStr(), drillId:'__session__', minutes:mins, seconds:secs, logged:true, sessionLog:true});
  state.profile.sessionTimer=null; await persistActivity(); await persistProfile(); setToast('Logged '+fmtTime(secs)+' session'); render();
}

}
async function regenTodayWithMinutes(){ state.planCache = computePlan(todayStr(), state.todayMinutes, state.planCache?state.planCache.salt:''); await sSet('plan-cache', state.planCache); render(); }
function adjustMinutes(delta){ state.todayMinutes = Math.max(15,(state.todayMinutes||state.profile.sessionLength)+delta); regenTodayWithMinutes(); }
function setCustomMinutes(){ const v=parseInt(document.getElementById('custom_min').value); if(v>0){ state.todayMinutes=v; regenTodayWithMinutes(); } }

function toggleSwapSelect(key){ state.swapSelection.has(key)?state.swapSelection.delete(key):state.swapSelection.add(key); render(); }
async function swapSelected(){
  const rand = mulberry32(Date.now()>>>0);
  state.planCache.items = state.planCache.items.map(item=>{
    if(!state.swapSelection.has(item.key)||item.fixed) return item;
    const used = state.planCache.items.map(i=>i.drillId);
    const pool = allDrills().filter(d=>d.area===item.area && !d.fixed && !used.includes(d.id));
    if(!pool.length) return item;
    const pick = pool[Math.floor(rand()*pool.length)];
    return {...item, drillId:pick.id, key:item.area+'_'+pick.id};
  });
  await sSet('plan-cache', state.planCache);
  state.swapMode=false; state.swapSelection=new Set(); render();
}

function toggleGameSwapSelect(id){ state.gameSwapSelection.has(id)?state.gameSwapSelection.delete(id):state.gameSwapSelection.add(id); render(); }
async function swapSelectedGames(){
  const rand = mulberry32(Date.now()>>>0);
  const current = state.planCache.games||[];
  state.planCache.games = current.map(id=>{
    if(!state.gameSwapSelection.has(id)) return id;
    const g = findGame(id);
    const pool = (g && g.performance ? ALL_GAMES.filter(x=>x.performance) : GAMES).filter(x=>x.id!==id && !current.includes(x.id));
    if(!pool.length) return id;
    return pool[Math.floor(rand()*pool.length)].id;
  });
  await sSet('plan-cache', state.planCache);
  state.gameSwapMode=false; state.gameSwapSelection=new Set(); render();
}

  </div>`;
  const todayGames = (plan.games||[]).map(id=>{ const g=findGame(id); if(!g) return '';

function buildExportText(){
  const totalMin = state.completions.reduce((s,c)=>s+(c.minutes||0),0);
  const h = Math.floor(totalMin/60), m = totalMin%60, totalStr = h?`${h}h ${m}m`:`${m}m`;
  const lines = [`⛳ ${state.profile.displayName}'s Range Caddy Log`, `📅 ${todayStr()}   🔥 ${computeStreak()}-day streak`, `${state.completions.length} drills logged · ${totalStr} total`, '', '🎯 Focus areas (most work needed first)'];
  state.ranking.slice(0,3).forEach((a,i)=>lines.push(`${i+1}. ${areaLabel(a)}`));
  lines.push('', '📋 Sessions (most recent first)');
  const byDate = {};
  [...state.completions].reverse().forEach(c=>{ (byDate[c.date] = byDate[c.date]||[]).push(c); });
  Object.keys(byDate).forEach(date=>{
    let dayTotal=0; const rows=[];
    byDate[date].forEach(c=>{ const d=allDrills().find(x=>x.id===c.drillId); const mins=c.minutes!=null?c.minutes:0; dayTotal+=mins;
      let label;
      if(c.sessionLog) label='Full session (timer)';
      else if(c.isGame) label=(c.gameName||'Game')+' (game)';
      else label=d?d.name+' ('+areaLabel(d.area)+')':c.drillId;
      rows.push(`   • ${label} — ${mins} min${c.logged?' (timed)':''}`); });
    lines.push(`${date} — ${dayTotal} min`); lines.push(...rows);
  });
  if(!state.completions.length) lines.push('(nothing logged yet)');
  if(state.swingWork.length){ lines.push('', '🏌️ Full-swing focus notes'); state.swingWork.forEach(s=>lines.push('   • '+s.name+(s.description?': '+s.description:''))); }
  return lines.join('\n');
}
function renderExportLog(){
  const text = buildExportText();
  return `<button class="linkback" onclick="switchView('profile')">‹ Profile</button><h1>Export Log</h1><p class="muted">Everything you've practiced, with time spent. Send it to your coach or copy it.</p>
  <textarea id="export_text" readonly style="width:100%;min-height:300px;font-family:'JetBrains Mono',monospace;font-size:12px">${escapeHtml(text)}</textarea>
  <button class="btn" style="margin-top:10px" onclick="textToCoach()">Text to My Coach</button>
  <button class="btn secondary" style="margin-top:8px" onclick="copyExportLog()">Copy to Clipboard</button>`;
}
function textToCoach(){
  const text = buildExportText();
  const saved = state.profile.coachPhone||'';
  const phone = prompt("Coach's phone number (leave blank to just open Messages):", saved) || '';
  if(phone!==saved){ state.profile.coachPhone=phone; persistProfile(); }
  const clean = phone.replace(/[^\d+]/g,'');
  const body = encodeURIComponent(text);
  window.location.href = (clean? 'sms:'+clean : 'sms:') + (/(iPhone|iPad|Mac)/.test(navigator.userAgent)?'&':'?') + 'body='+body;
}

/* ---------- init ---------- */
async function init(){
  const prof = await sGet('profile', null);
  const act = await sGet('activity', {completions:[],favorites:[],customDrills:[],swingWork:[]});
  const plan = await sGet('plan-cache', null);
  if(prof){ state.profile=prof.profile; state.ranking=prof.ranking;
    if(state.profile && !state.profile.startOrder){ const sa=state.profile.startArea||AREAS[0].id; state.profile.startOrder=[sa, ...AREAS.map(a=>a.id).filter(x=>x!==sa)]; } }
  state.completions=act.completions||[]; state.favorites=act.favorites||[]; state.customDrills=act.customDrills||[]; state.swingWork=act.swingWork||[];
  state.planCache=plan;
  state.view = state.profile ? 'today' : 'onboarding';
  render();
}
init();
</script>
</body>
</html>
