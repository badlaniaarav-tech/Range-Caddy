  </div>
  <button class="btn secondary" onclick="switchView('profile_edit')">Retake Survey</button>
  <button class="btn secondary" style="margin-top:8px" onclick="switchView('swingwork')">My Swing Work (private)</button>
  <button class="btn secondary" style="margin-top:8px" onclick="switchView('practicetime')">Practice Time</button>
  <button class="btn secondary" style="margin-top:8px" onclick="switchView('suggest')">Suggest a Drill</button>
  ${isAdmin()?`<button class="btn" style="margin-top:8px;background:var(--flag);color:var(--ink)" onclick="switchView('review')">🛠️ Review Suggestions</button>`:''}
  <button class="btn secondary" style="margin-top:8px" onclick="switchView('exportlog')">Export Practice Log for Coach</button>
  ${currentUser?`<button class="btn secondary" style="margin-top:18px" onclick="signOutUser()">Sign Out</button>`:''}
  <button class="btn danger" style="margin-top:8px" onclick="resetAll()">Reset App Data</button>`;
}

function renderToday(){
  ensureTodayPlan();
  const plan = state.planCache;
  const streak = computeStreak();
  const untimed = state.profile.sessionMode==='untimed';
  const focusAreas = (state.focusAreas && state.focusAreas.length ? state.focusAreas : state.ranking.slice(0,3)).map(areaLabel).join(' · ');
  const doneToday = plan.items.filter(it=>state.completions.some(c=>c.date===todayStr()&&c.drillId===it.drillId)).length;

  const planMins = plan.items.reduce((s,i)=>s+(i.minutes||0),0);
  // Whole-session stopwatch. Always visible so it can be started and stopped on its own,
  // separate from the per-drill timer on each drill page.
  ensureSessionTicking();
  const st = state.profile.sessionTimer;
  const stSecs = st ? (st.running ? Math.floor((Date.now()-st.start)/1000) : st.elapsed) : 0;
  const timerRow = `
    <div class="sessiontimer">
      <div class="timerow">
        <div>
          <div class="ctrllbl" style="margin:0 0 3px">Session stopwatch</div>
          <span id="session_timer" class="num sessionclock">${fmtTime(stSecs)}</span>
          ${st ? `<span class="timerstate ${st.running?'live':''}">${st.running?'● running':'paused'}</span>` : ''}
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          ${!st ? `<button class="btn small" onclick="startSessionTimer()">▶ Start</button>`
            : st.running ? `<button class="btn small secondary" onclick="pauseSessionTimer()">⏸ Stop</button><button class="btn small" onclick="logSessionTimer()">Finish &amp; Log</button>`
            : `<button class="btn small secondary" onclick="startSessionTimer()">▶ Resume</button><button class="btn small" onclick="logSessionTimer()">Finish &amp; Log</button>`}
        </div>
      </div>
      ${!st ? `<p class="muted" style="font-size:11.5px;margin:8px 0 0">Times your whole practice. Each drill also has its own timer so you can see how long that drill took you.</p>` : ''}
    </div>`;

  const timeCard = untimed ? `
    <div class="timecard">
      <div class="timerow"><div><div style="font-weight:800;font-size:15px">Untimed session</div><div class="muted" style="font-size:12.5px;margin-top:3px">Work each drill until you hit its success mark.</div></div>
      <button class="btn small secondary" style="flex-shrink:0" onclick="toggleSessionMode()">Use a clock</button></div>${timerRow}</div>` : `
    <div class="timecard">
      <div class="timerow">
        <button class="stepbtn" onclick="adjustMinutes(-15)">−</button>
        <div class="timeval"><div class="timenum">${plan.minutes} MIN</div><div class="timelbl">How long I have today</div></div>
        <button class="stepbtn" onclick="adjustMinutes(15)">+</button>
      </div>
      <div style="text-align:center;margin-top:7px"><button class="linkbtn" style="font-size:12px;color:var(--fairway)" onclick="toggleSessionMode()">⏱ Switch to untimed — no clock, just hit the target</button></div>
      <p class="muted" style="font-size:12px;text-align:center;margin:7px 0 0">${planMins>plan.minutes
        ? `This plan can't go below <strong>${planMins} min</strong> — every drill needs at least 5.`
        : 'Fewer minutes = fewer drills. We always keep what you need most.'}</p>
      ${timerRow}
    </div>`;

  // "What do you want to work on today?" — pick areas and the whole plan rebuilds around them.
  const focusOn = state.focusAreas && state.focusAreas.length;
  const draft = state.focusDraft || new Set();
  const focusCard = state.focusPanelOpen ? `
    <div class="focuscard">
      <div class="rowline"><strong style="font-size:13.5px">Work on today</strong><button class="linkbtn" style="font-size:12px" onclick="toggleFocusPanel()">Close</button></div>
      <div class="focusgrid">
        ${AREAS.map(a=>`<button class="focuschip ${draft.has(a.id)?'on':''}" onclick="toggleFocusArea('${a.id}')">
          <span class="focustick">${draft.has(a.id)?'✓':''}</span>${AREA_SHORT[a.id]||a.label}</button>`).join('')}
      </div>
      <div class="adjustrow" style="margin-top:10px">
        <button class="btn small" style="flex:1" onclick="applyFocus()">Build${draft.size?' ('+draft.size+')':''}</button>
        <button class="btn small secondary" style="flex:1" onclick="clearFocus()">Everything</button>
      </div>
    </div>`
    : (focusOn
      ? `<div class="focusactive">
           <span style="font-size:12.5px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🎯 ${state.focusAreas.map(a=>AREA_SHORT[a]||areaLabel(a)).join(' · ')}</span>
           <div style="display:flex;gap:6px;flex-shrink:0"><button class="linkbtn" style="font-size:12px;color:var(--fairway)" onclick="toggleFocusPanel()">Change</button><button class="linkbtn" style="font-size:12px;color:var(--fairway)" onclick="clearFocus()">Reset</button></div>
         </div>`
      : `<button class="focusbtn" onclick="toggleFocusPanel()">🎯 Only want to work on certain areas?</button>`);

  const dpref = state.profile.difficultyPref || 'normal';
  // Always-visible controls: how hard the targets are, and swapping / regenerating drills.
  const controlBar = `
    <div class="ctrlcard">
      <div class="ctrllbl">Difficulty</div>
      <div class="diffrow">
        <button class="diffbtn ${dpref==='easier'?'active':''}" onclick="setDifficultyPref('easier')">Easy</button>
        <button class="diffbtn ${dpref==='normal'?'active':''}" onclick="setDifficultyPref('normal')">Normal</button>
        <button class="diffbtn ${dpref==='harder'?'active':''}" onclick="setDifficultyPref('harder')">Hard</button>
      </div>
      <div class="ctrllbl">Not feeling these drills?</div>
      <div class="adjustrow">
        ${state.swapMode
          ? `<button class="btn" onclick="swapSelected()">↻ Swap ${state.swapSelection.size} selected</button><button class="btn secondary" onclick="toggleSwapMode()">Cancel</button>`
          : `<button class="btn secondary" onclick="toggleSwapMode()">☑ Select drills to swap</button><button class="btn secondary" onclick="regenerateToday()">↻ Regenerate all</button>`}
      </div>
      ${state.swapMode?'<p class="muted" style="font-size:12px;margin:9px 0 0">Tick the drills you want replaced, then hit Swap.</p>':''}
    </div>`;

  const adjustPanel = state.adjustOpen ? `
    <div class="adjustpanel">
      <div class="rowline"><strong style="font-size:15px">More options</strong><button class="linkbtn" onclick="toggleAdjust()">Done</button></div>
      <div class="adjustlbl" style="margin-top:12px">Session size</div>
      <div class="adjustrow">
        <button class="btn secondary" onclick="openMoreDrills()">Give me more drills</button>
        <button class="btn secondary" onclick="toggleReducedMode()">${state.reducedMode?'Back to full plan':'Give me fewer drills'}</button>
      </div>
      <div class="adjustrow" style="margin-top:8px">
        <button class="btn secondary" onclick="setCustomMinutesPrompt()">Set exact minutes</button>
        <button class="btn secondary" onclick="toggleRemoveMode()">${state.removeMode?'Done removing':'Remove a drill'}</button>
      </div>
      <div class="adjustlbl">Prefer to choose yourself?</div>
      <div class="adjustrow"><button class="btn secondary" onclick="switchView('buildplan')">Build my own plan →</button>
      ${untimed?'':`<button class="btn secondary" onclick="toggleSessionMode()">Switch to untimed</button>`}</div>
    </div>` : `<button class="adjustbtn" onclick="toggleAdjust()">⚙ More options — session size &amp; more</button>`;

  const mdDraft = state.moreDrillsDraft || new Set();
  const moreDrillsCard = state.moreDrillsOpen ? `
    <div class="focuscard">
      <div class="rowline"><strong style="font-size:13.5px">More drills — which areas?</strong><button class="linkbtn" style="font-size:12px" onclick="closeMoreDrills()">Close</button></div>
      <div class="focusgrid">
        ${AREAS.map(a=>`<button class="focuschip ${mdDraft.has(a.id)?'on':''}" onclick="toggleMoreArea('${a.id}')">
          <span class="focustick">${mdDraft.has(a.id)?'✓':''}</span>${AREA_SHORT[a.id]||a.label}</button>`).join('')}
      </div>
      <div class="adjustrow" style="margin-top:10px">
        <button class="btn small" style="flex:1" onclick="applyMoreDrills()">Add${mdDraft.size?' ('+mdDraft.size+')':''}</button>
        <button class="btn small secondary" style="flex:1" onclick="closeMoreDrills()">Cancel</button>
      </div>
      <p class="muted" style="font-size:11.5px;margin:9px 0 0">One drill is added per area you pick — we choose which.</p>
    </div>` : '';
  const removeBanner = state.removeMode ? `
    <div class="focusactive" style="border-left-color:var(--danger)">
      <span style="font-size:12.5px;font-weight:800">✕ Tap Remove on any drill</span>
      <button class="linkbtn" style="font-size:12px;color:var(--fairway)" onclick="toggleRemoveMode()">Done</button>
    </div>` : '';
  const sessionHeader = `
    <div class="sectionband">
      <h2 class="sectionhead">Your practice plan</h2>
      <p class="sectionsub">Broken into blocks with a time budget for each. Work down in order — tap a drill for setup instructions, then tap the circle to check it off.</p>
    </div>
    ${focusCard}${moreDrillsCard}${removeBanner}${controlBar}${adjustPanel}`;

  // Group today's drills by area so the session reads as blocks with their own time budget.
  const groups = [];
  plan.items.forEach(item=>{
    let g = groups.find(x=>x.area===item.area);
    if(!g){ g = {area:item.area, items:[]}; groups.push(g); }
    g.items.push(item);
  });
  let stepNo = 0;
  const renderCard = item=>{
    const d = allDrills().find(x=>x.id===item.drillId) || {name:'Drill unavailable',description:'',setup:'',repsOrTime:'',success:'',difficulty:''};
    const comp = state.completions.find(c=>c.date===todayStr()&&c.drillId===item.drillId);
    const done = !!comp;
    const took = comp && comp.tookSeconds!=null ? comp.tookSeconds : null;
    const isFocus = item.area===state.ranking[0] && !item.fixed;
    const added = String(item.key).startsWith('added_');
    stepNo++;
    return `<div class="drillcard ingroup ${isFocus?'focus':''} ${done?'isdone':''}" id="drillcard_${stepNo}">
      <span class="drillnum">${stepNo}</span>
      <div class="drillbody" onclick="openDrill('${item.drillId}','today')">
        <div class="drillarea">${item.fixed?'always first':(!untimed&&item.minutes?item.minutes+' min':areaLabel(item.area))}${d.difficulty?' · '+d.difficulty:''}</div>
        <div class="drillname">${escapeHtml(d.name)}</div>
        <div class="drilldesc">${escapeHtml(d.description)}</div>
        <div class="drilltarget">🎯 ${escapeHtml(d.repsOrTime)}</div>${targetTweak()}
        ${took!=null?`<div class="muted" style="font-size:11.5px;margin-top:6px">⏱ Took ${fmtTime(took)}</div>`:''}
        <div class="cardacts">
          <span class="drillopen">Tap for full instructions ›</span>
          <button class="linkbtn cardact" onclick="event.stopPropagation();logDrillTime('${item.drillId}')">⏱ ${took!=null?'Edit time':'Enter time'}</button>
          ${(added || state.removeMode) && !item.fixed?`<button class="linkbtn cardact" style="color:var(--danger)" onclick="event.stopPropagation();removePlanItem('${item.key}')">✕ Remove</button>`:''}
        </div>
      </div>
      ${state.swapMode && !item.fixed
        ? `<span class="bigcheck ${state.swapSelection.has(item.key)?'done':''}" onclick="toggleSwapSelect('${item.key}')">${state.swapSelection.has(item.key)?'✓':''}</span>`
        : `<span class="bigcheck ${done?'done':''}" onclick="toggleComplete('${item.drillId}')" title="Mark done">${done?'✓':''}</span>`}
    </div>`;
  };
  const cards = groups.map((g,gi)=>{
    const mins = g.items.reduce((s,i)=>s+(i.minutes||0),0);
    const gDoneN = g.items.filter(i=>state.completions.some(c=>c.date===todayStr()&&c.drillId===i.drillId)).length;
    const rank = state.ranking.indexOf(g.area)+1;
    // real time spent in this block, added up from the drills that have been logged
    const spentSecs = g.items.reduce((s,i)=>{
      const c = state.completions.find(x=>x.date===todayStr() && x.drillId===i.drillId);
      return s + (c && c.tookSeconds!=null ? c.tookSeconds : 0);
    }, 0);
    const allGDone = gDoneN===g.items.length;
    const head = `<div class="areahead ${allGDone?'areadone':''}">
      <span class="areaicon">${AREA_ICON[g.area]}</span>
      <div style="flex:1;min-width:0">
        <div class="areaname">${gi+1}. ${AREA_SHORT[g.area]||areaLabel(g.area)}</div>
        <div class="areameta">${g.items.length} drill${g.items.length===1?'':'s'}${untimed?'':' · about '+mins+' min'}${rank===1?' · your #1 focus':''}</div>
      </div>
      ${spentSecs>0?`<span class="areatime">${fmtTime(spentSecs)}</span>`:''}
      <span class="areahint">${allGDone?'Undo all':'Mark all'}</span>
      <button class="areaprog ${allGDone?'done':''}" onclick="toggleSection('${g.area}')" title="${allGDone?'Un-check this whole section':'Check off this whole section'}">${allGDone?'✓':gDoneN+'/'+g.items.length}</button>
    </div>`;
    return head + g.items.map(renderCard).join('');
  }).join('') || '<div class="empty">No drills scheduled — try adding more time above.</div>';

  // add-drill panel
  // Add-a-drill: choose the part of your game first, then see a short list — not all 124 at once.
  const addArea = state.addDrillArea && state.addDrillArea!=='all' ? state.addDrillArea : null;
  const addPool = addArea
    ? allDrills().filter(d=>!d.fixed && !d.performance && d.area===addArea && !plan.items.some(i=>i.drillId===d.id)).slice(0,8)
    : [];
  const addPanel = state.addDrillOpen ? `
    <div class="focuscard">
      <div class="rowline"><strong style="font-size:13.5px">${addArea?'Add a '+areaLabel(addArea).toLowerCase()+' drill':'Add a drill — pick an area'}</strong><button class="linkbtn" style="font-size:12px" onclick="${addArea?"setAddDrillArea('all')":'toggleAddDrill()'}">${addArea?'‹ Back':'Close'}</button></div>
      ${!addArea ? `<div class="focusgrid">${AREAS.map(a=>{
            const n = allDrills().filter(d=>!d.fixed && !d.performance && d.area===a.id && !plan.items.some(i=>i.drillId===d.id)).length;
            return `<button class="focuschip" ${n?'':'disabled style="opacity:.4"'} onclick="setAddDrillArea('${a.id}')">${AREA_SHORT[a.id]||a.label} <span class="muted" style="font-size:11px">${n}</span></button>`;
          }).join('')}</div>`
        : (addPool.length ? addPool.map(d=>`<div class="addrow">
             <div style="min-width:0"><div class="addname">${escapeHtml(d.name)}</div><div class="adddesc">${escapeHtml(d.description)}</div></div>
             <button class="btn small" style="flex-shrink:0" onclick="addDrillToPlan('${d.id}')">Add</button></div>`).join('')
           : '<p class="muted" style="font-size:12.5px;margin-top:10px">Nothing left to add here.</p>')}
    </div>` : `<button class="focusbtn" onclick="toggleAddDrill()">＋ Add another drill</button>`;


  // performance & games section
  const gamesHeader = `
  <div class="sectionband">
    <h2 class="sectionhead">Test yourself</h2>
    <p class="sectionsub">Scored challenges and games. Do these after your drills to see if the work is paying off — most have a PGA Tour benchmark to beat.</p>
    <div class="bandbtns">
      ${state.gameSwapMode ? `<button class="linkbtn" onclick="swapSelectedGames()">↻ Swap (${state.gameSwapSelection.size})</button><button class="linkbtn" onclick="toggleGameSwapMode()">Cancel</button>`
        : `<button class="linkbtn" onclick="toggleGameSwapMode()">☑ Swap some</button><button class="linkbtn" onclick="regenerateGames()">↻ Regenerate all</button>`}
    </div>
  </div>`;
  const todayGames = (plan.games||[]).map(id=>{ const g=findGame(id); if(!g) return '';
    const fav=state.favorites.includes(id);
    const gDone=state.completions.some(c=>c.date===todayStr()&&c.drillId===id&&c.isGame);
    return `<div class="drillcard ${gDone?'isdone':''}">
      <span class="drillnum" style="background:var(--flag);color:var(--ink)">🏆</span>
      <div class="drillbody" onclick="openGame('${id}','today')">
        <div class="drillarea">${escapeHtml(g.players)}${g.performance?' · scored':''}</div>
        <div class="drillname">${escapeHtml(g.name)}</div>
        <div class="drilldesc">${escapeHtml(g.description)}</div>
        <div class="drillopen">Tap to see how it works ›</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0">
        ${state.gameSwapMode ? `<span class="bigcheck ${state.gameSwapSelection.has(id)?'done':''}" onclick="toggleGameSwapSelect('${id}')">${state.gameSwapSelection.has(id)?'✓':''}</span>`
          : `<span class="bigcheck ${gDone?'done':''}" onclick="toggleGameComplete('${id}')">${gDone?'✓':''}</span><button class="starbtn" onclick="toggleFavorite('${id}')">${fav?'★':'☆'}</button>`}
      </div>
    </div>`; }).join('') || '<div class="empty">No games today — add one from the Games tab.</div>';
  const perfDrillCards = (plan.perfDrills||[]).map(item=>{
    const d = allDrills().find(x=>x.id===item.drillId); if(!d) return '';
    const done = state.completions.some(c=>c.date===todayStr()&&c.drillId===item.drillId);
    return `<div class="drillcard ${done?'isdone':''}">
      <span class="drillnum" style="background:var(--flag);color:var(--ink)">🏆</span>
      <div class="drillbody" onclick="openDrill('${item.drillId}','today')">
        <div class="drillarea">${areaLabel(item.area)} · performance test</div>
        <div class="drillname">${escapeHtml(d.name)}</div>
        <div class="drilldesc">${escapeHtml(d.description)}</div>
        <div class="drilltarget">🎯 ${escapeHtml(d.success)}</div>
        <div class="drillopen">Tap for full instructions ›</div>
      </div>
      <span class="bigcheck ${done?'done':''}" onclick="toggleComplete('${item.drillId}')">${done?'✓':''}</span>
    </div>`; }).join('');
  const gamePool = allGames().filter(g=>!(plan.games||[]).includes(g.id));
  const addGamePanel = state.addGameOpen ? `
    <div class="card">
      <div class="rowline"><strong>Add a game to today</strong><button class="linkbtn" onclick="toggleAddGame()">Close</button></div>
      ${gamePool.map(g=>`<div class="rowline" style="padding:7px 0;border-top:1px solid var(--line)"><span style="font-size:13px">${escapeHtml(g.name)} <span class="muted">· ${escapeHtml(g.players)}</span></span><button class="btn small" onclick="addGameToToday('${g.id}')">Add</button></div>`).join('') || '<p class="muted">All games are already in today.</p>'}
    </div>` : `<button class="btn secondary" onclick="toggleAddGame()">+ Add a Game</button>`;
  const gamesSection = `<div class="divider"></div>${gamesHeader}${perfDrillCards}${todayGames}${addGamePanel}`;

  const dateLabel = new Date().toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
  const total = plan.items.length;
  const pct = total ? Math.round(doneToday/total*100) : 0;
  const allDone = total>0 && doneToday===total;
  const cta = allDone
    ? `<button class="startbtn done" onclick="switchView('practicetime')">🎉 Session complete — see your stats</button>`
    : `<button class="startbtn" onclick="startPractice()">${doneToday===0?'▶  Start Practice':`▶  Continue — ${total-doneToday} drill${total-doneToday===1?'':'s'} to go`}</button>`;
  return `
  <div class="herocard">
    <div class="herotop">
      <div class="herohi">Hey ${escapeHtml(state.profile.displayName)} 👋</div>
      <div class="herodate">${ICON_CALENDAR}${dateLabel}</div>
    </div>
    <div class="herostats">
      <div class="herostat"><div class="herostatnum">${doneToday}/${total}</div><div class="herostatlbl">Drills done</div></div>
      <div class="herostat"><div class="herostatnum">${streak}</div><div class="herostatlbl">🔥 Day streak</div></div>

/* Golf terms that appear in the drill text, in plain English. Only the ones actually used in
   the drill you are looking at get shown. */
const GLOSSARY = [
  [/\bup (?:and|&) down\b/i, 'Up and down', 'Getting the ball in the hole in two shots from off the green — one chip or pitch, then one putt.'],
  [/\bGIR\b|\bgreen(?:s)? in regulation\b/i, 'Green in regulation (GIR)', 'Hitting the green in the expected number of shots: 1 on a par 3, 2 on a par 4, 3 on a par 5.'],
  [/\blag\b|\blag putting\b/i, 'Lag putt', 'A long putt where the goal is to leave it close enough for an easy tap-in, not to hole it.'],
  [/\bspoke\b/i, 'Spoke', 'Tees arranged in a circle around the hole like the spokes of a wheel, so you putt from every angle.'],
  [/\bgate\b/i, 'Gate', 'Two tees set just wider than the ball or the putter head. You have to roll the ball through the gap.'],
  [/\bdrawback\b/i, 'Drawback', 'A penalty rule: if a putt finishes short or too far past, you drag the ball further away before the next one.'],
  [/\bproximity\b/i, 'Proximity', 'How close to the hole your ball finishes, measured in feet. Lower is better.'],
  [/\bshort[- ]sided\b/i, 'Short-sided', 'When the pin is close to your side of the green, leaving you almost no room to land the ball.'],
  [/\bapex\b/i, 'Apex', 'The high point of a breaking putt — the spot the ball curves out to before turning back to the hole.'],
  [/\bbreak(?:ing)?\b/i, 'Break', 'The amount a putt curves because the green is sloped. You aim away from the hole to allow for it.'],
  [/\btolerance\b/i, 'Tolerance', 'The margin you are allowed. "±3 yards" means anything within 3 yards of the number counts as a pass.'],
  [/\bcarry\b/i, 'Carry', 'How far the ball flies in the air before it lands, ignoring any roll afterwards.'],
  [/\bstock shot\b/i, 'Stock shot', 'Your normal, repeatable shot — the one you would hit under pressure without thinking about it.'],
  [/\bfringe\b/i, 'Fringe', 'The ring of slightly longer grass around the edge of the green.'],
  [/\balignment stick\b/i, 'Alignment stick', 'A long thin rod you lay on the ground or stand up as a target. A spare club works just as well.'],
  [/\bpin high\b/i, 'Pin high', 'Level with the flag — the right distance, even if it is left or right of the hole.'],
  [/\btrajectory\b|\bflight\b/i, 'Trajectory', 'How high or low the ball flies. Low, medium and high are controlled by ball position and how far you follow through.'],
  [/\blanding spot\b/i, 'Landing spot', 'The exact patch of green you want the ball to bounce on first, before it rolls out.'],
  [/\bhigh side\b/i, 'High side', 'The uphill side of the hole on a breaking putt. Missing on the high side gives the ball a chance to fall in.'],
  [/\bupslope\b|\bdownslope\b/i, 'Upslope / downslope', 'The ball sitting on ground that runs uphill or downhill relative to your stance.'],
  [/\bball (?:above|below) (?:your )?feet\b/i, 'Ball above / below feet', 'Sidehill lies where the ball sits higher or lower than where you are standing, which changes how the ball curves.'],
  [/\bscramble\b/i, 'Scramble', 'Playing more than one ball and taking the best result, or the percentage of missed greens where you still make par.'],
  [/\bone[- ]putt\b/i, 'One-putt', 'Holing out with a single putt once you are on the green.'],
  [/\bstableford\b/i, 'Stableford', 'A scoring format using points per hole instead of total strokes, so one bad hole cannot wreck the round.'],
  [/\bbounce\b/i, 'Bounce', 'The angled sole on the bottom of a wedge that stops it digging into sand or turf.'],
  [/\bloft\b/i, 'Loft', 'The angle on the clubface. More loft means a higher, shorter shot.'],
  [/\d{2}\s*°|\b(?:LW|SW|GW|PW)\b|\blob wedge\b|\bsand wedge\b/i, 'Wedge degrees (54°, 60°)', 'Wedges are named by their loft in degrees. 46-48° is a pitching wedge (PW), 50-52° a gap wedge (GW), 54-56° a sand wedge (SW), and 58-60° a lob wedge (LW). Higher number = higher and shorter.'],
  [/\bhybrid\b/i, 'Hybrid', 'A club that replaces a long iron. Easier to get airborne and more forgiving on mishits.'],
  [/\bbirdie\b|\bbogey\b|\beagle\b|\bpar\b/i, 'Par, birdie, bogey', 'Par is the expected score for a hole. A birdie is one under par, an eagle two under, a bogey one over.'],
  [/\bdivot\b/i, 'Divot', 'The strip of turf the club takes out after the ball. With irons the divot should start in front of the ball, never behind it.'],
  [/\bthin\b|\bchunk\b|\bfat\b/i, 'Thin / fat', 'Thin means catching the ball too high so it flies low and hot. Fat (or a chunk) means hitting the ground first so it comes up short.'],
  [/\btap[- ]in\b/i, 'Tap-in', 'A putt short enough that you can hole it without really thinking — usually inside two feet.']
];
function drillJargon(d){
  const text = [d.description, d.setup, d.repsOrTime, d.success].join(' ');
  const out = [];
  GLOSSARY.forEach(([re,term,def])=>{ if(re.test(text) && !out.some(x=>x[0]===term)) out.push([term,def]); });
  return out.slice(0,6);
}
function explainDrill(d){
  const w = AREA_WHY[d.area] || {};
  const area = areaLabel(d.area).toLowerCase();
  const diff = d.difficulty ? d.difficulty.toLowerCase() : '';
  const parts = [];
  parts.push(`<strong>In plain English.</strong> ${escapeHtml(d.description)}`);
  const lead = diff ? `${/^[aeiou]/.test(diff)?'an':'a'} ${diff}-level ${area} drill` : `a ${area} drill`;
  if(w.trains) parts.push(`<strong>What it's training.</strong> This is ${lead}, and it works on ${w.trains}.`);
  if(w.matters) parts.push(`<strong>Why it matters.</strong> ${w.matters}`);
  parts.push(`<strong>How you'll know it's working.</strong> ${escapeHtml(d.success)}${/[.!?]$/.test(d.success)?'':'.'} Don't rush to finish it — the point is the standard, not the reps.`);
  if(w.mistake) parts.push(`<strong>The usual mistake.</strong> ${w.mistake}`);
  if(d.performance) parts.push(`<strong>This one is scored.</strong> Write your number down every time you do it. A performance test is only useful if you can compare today against last month.`);
  return parts;
}
/* One action = a plain line; several = a numbered list. */
function listOrText(steps){
  if(!steps.length) return '<div class="stepcardtxt">—</div>';
  if(steps.length===1) return `<div class="stepcardtxt">${escapeHtml(steps[0])}</div>`;
  return `<ol class="steplist">${steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol>`;
}
/* Break a setup or instruction blob into individual actions so it reads as real steps. */
function splitSteps(text){
  if(!text) return [];
  // Hide the dots that aren't sentence ends (abbreviations, decimals) before splitting on them.
  const D = '@@DOT@@';
  const guard = String(text)
    .replace(/\b(e|i)\.(g|e)\./gi, m=>m.split('.').join(D))
    .replace(/\b(approx|vs)\./gi, m=>m.split('.').join(D))
    .replace(/(\d)\.(\d)/g, '$1'+D+'$2');
  return guard.split(/\.\s+|;\s+/)
    .map(s=>s.trim().replace(/[.;,\s]+$/,'').split(D).join('.'))
    .filter(s=>s.length>2);
}

      <button class="linkbtn" style="font-size:12px" onclick="openGame('${g.id}','games')">Open game ›</button></div>`; };
  if(f==='fav'){
    const favG = allGames().filter(g=>state.favorites.includes(g.id));
    const list = favG.map(gameCard).join('') || '<div class="empty">No favorite games yet — tap ☆ on any game.</div>';
    return `<h1>Games</h1><select onchange="setGameFilter(this.value)" style="margin-bottom:12px"><option value="all">All games</option><option value="fav" selected>★ Favorites</option></select>${list}`;
  }
  const cGames = communityGames();
  return `<h1>Games</h1><p class="muted">Formats to test what you've built against real pressure. Tap a game to open it, add it to today, and time your round.</p>
  <select onchange="setGameFilter(this.value)" style="margin:12px 0"><option value="all" selected>All games</option><option value="fav">★ Favorites</option></select>
  <h2 style="margin-top:8px">On-Course Games</h2>${GAMES.map(gameCard).join('')}
  <h2 style="margin-top:16px">Practice Games</h2>${PRACTICE_GAMES.map(gameCard).join('')}
  ${cGames.length?`<h2 style="margin-top:16px">Suggested by Golfers</h2>${cGames.map(gameCard).join('')}`:''}`;
}

function renderGameDetail(){
  const g = findGame(state.detailGameId);
  if(!g) return `<button class="linkback" onclick="closeGame()">‹ Back</button><div class="empty">Game not found.</div>`;
  const fav = state.favorites.includes(g.id);
  const inToday = state.planCache && (state.planCache.games||[]).includes(g.id);
  const timing = state.timer;
  return `<button class="linkback" onclick="closeGame()">‹ Back</button>
  <div class="rowline"><span class="pill">${g.players}</span><button class="starbtn" onclick="toggleFavorite('${g.id}')">${fav?'★':'☆'}</button></div>
  <h1 style="margin-top:8px">${escapeHtml(g.name)}${g.performance?' <span class="perfbadge">🏆 Performance</span>':''}</h1>
  ${inToday ? `<button class="btn secondary" onclick="setToast('Already in today')">✓ In Today's Games</button>` : `<button class="btn" onclick="addGameToToday('${g.id}')">Use / Add to Today</button>`}
  <div class="card" style="margin-top:14px"><p>${escapeHtml(g.description)}</p><p style="font-size:13.5px"><strong>How to play:</strong> ${escapeHtml(g.how)}</p></div>
  <div class="card"><strong>Play this game</strong>
    ${timing ? `<div style="text-align:center;margin:10px 0"><span id="timer_display" class="num" style="font-size:34px">${fmtTime(timing.elapsed)}</span></div>
      <button class="btn" onclick="finishGameTimed()">Finish & Log Time</button>
      <button class="btn secondary" style="margin-top:8px" onclick="stopTimer()">Pause</button>`
    : `<p class="muted" style="margin-top:6px">Start the timer to log how long you played.</p><button class="btn" onclick="startTimer()">Start Timer</button>`}
  </div>`;
}

function renderPracticeTime(){
  const byDate={}; state.completions.forEach((c,i)=>{ (byDate[c.date]=byDate[c.date]||[]).push({c,i}); });
  const dates = Object.keys(byDate).sort().reverse();
  const entryRow = ({c,i})=>{
    const label = c.sessionLog?'Full session (timer)': c.isGame?(c.gameName||'Game') : (allDrills().find(x=>x.id===c.drillId)?.name || c.drillId);
    const dur = c.seconds!=null ? fmtTime(c.seconds) : (c.minutes!=null ? c.minutes+'m' : (c.tookSeconds!=null ? 'took '+fmtTime(c.tookSeconds) : 'done'));
    return `<div class="ptrow">
      <span class="ptname">${escapeHtml(label)} <span class="muted">— ${dur}</span></span>
      <span style="display:flex;gap:6px;flex-shrink:0"><button class="linkbtn" style="font-size:12px" onclick="editCompletionTime(${i})">Edit</button><button class="linkbtn" style="font-size:12px;color:var(--danger)" onclick="removeCompletionEntry(${i})">✕</button></span>
    </div>`;
  };
  const rows = dates.map(date=>{
    const list = byDate[date];
    const dayMin = list.reduce((s,{c})=>s+(c.minutes||0),0);
    // the whole-session stopwatch total goes at the top of the day
    const sessionRows = list.filter(({c})=>c.sessionLog);
    const games = list.filter(({c})=>c.isGame);
    const drills = list.filter(({c})=>!c.sessionLog && !c.isGame);
    // group the drills by part of the game
    const byArea={};
    drills.forEach(o=>{ const d=allDrills().find(x=>x.id===o.c.drillId); const k=d?d.area:'other'; (byArea[k]=byArea[k]||[]).push(o); });
    const areaOrder = AREAS.map(a=>a.id).filter(a=>byArea[a]).concat(byArea.other?['other']:[]);
    const sections = areaOrder.map(areaId=>{
      const mins = byArea[areaId].reduce((s,{c})=>s+(c.minutes||0),0);
      return `<div class="ptsection"><span>${areaId==='other'?'Other':areaLabel(areaId)}</span><span class="muted">${mins?mins+' min':''}</span></div>`
        + byArea[areaId].map(entryRow).join('');
    }).join('');
    const gameBlock = games.length ? `<div class="ptsection"><span>Games &amp; tests</span><span></span></div>`+games.map(entryRow).join('') : '';
    const totalBanner = `<div class="pttotal"><span>Total time</span><span class="num">${dayMin} min</span></div>`
      + sessionRows.map(entryRow).join('');
    return `<div class="card"><strong>${prettyDate(date)}</strong>${totalBanner}${sections}${gameBlock}</div>`;
  }).join('') || '<div class="empty">No practice logged yet.</div>';
  return `<button class="linkback" onclick="switchView('profile')">‹ Profile</button><h1>Practice Time</h1><p class="muted">Total: ${totalPracticeMinutes()}. Each day shows your total first, then what you did in each part of the game.</p>${rows}`;
}

function renderSwingWork(){
  const rows = state.swingWork.map(s=>`<div class="card"><div class="rowline"><strong>${escapeHtml(s.name)}</strong><button class="starbtn" onclick="removeSwingWork('${s.id}')">✕</button></div>
    <span class="pill" style="margin:4px 0;display:inline-block">${areaLabel(s.area)}</span>
    ${s.description?`<p class="muted">${escapeHtml(s.description)}</p>`:''}
    <span class="muted" style="font-size:11px">${s.autoAdd?'Auto-added to daily practice':'Not in daily practice'} · ${s.date}</span></div>`).join('') || '<div class="empty">Nothing logged yet.</div>';
  return `<button class="linkback" onclick="switchView('profile')">‹ Profile</button><h1>My Swing Work</h1><p class="muted">Private notes on full-swing mechanics you're working on. Only visible to you on this device.</p>
  <label>Name</label><input type="text" id="sw_name" placeholder="e.g. Trail elbow connection">
  <label>Description</label><textarea id="sw_desc" placeholder="What are you working on?"></textarea>
  <label>Section</label><select id="sw_area">${AREAS.map(a=>`<option value="${a.id}">${a.label}</option>`).join('')}</select>
  <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-family:'Inter';font-size:13px;margin-top:12px"><input type="checkbox" id="sw_auto"> Add to my everyday practice automatically (won't ask again)</label>
  <button class="btn small" style="margin-top:10px" onclick="addSwingWork()">Add</button>
  <div style="margin-top:14px">${rows}</div>`;
}

function renderSuggest(){
  const approved = state.approvedSuggestions||[];
  const rows = approved.map(s=>{
    const badge = s.kind==='game' ? '<span class="pill">Game</span>' : s.kind==='performance' ? '<span class="perfbadge">🏆 Performance</span>' : '<span class="pill">Drill</span>';
    return `<div class="card">${s.kind!=='game'?`<span class="pill">${areaLabel(s.area)}</span> `:''}${badge}<h2 style="margin-top:8px">${escapeHtml(s.name)}</h2><p class="muted">${escapeHtml(s.description)}</p><p style="font-size:11px" class="muted">suggested by ${escapeHtml(s.author||'a golfer')}</p></div>`;
  }).join('') || '<div class="empty">Nothing suggested yet — be the first!</div>';
  return `<button class="linkback" onclick="switchView('profile')">‹ Profile</button><h1>Suggest a Drill or Game</h1><p class="muted">Share an idea. It's sent for review, and once approved it shows up for everyone as a normal drill, a performance drill, or a game.</p>
  <label>Type</label><select id="sug_kind"><option value="drill">Practice drill</option><option value="performance">Performance drill</option><option value="game">Game</option></select>
  <label>Area (ignored for games)</label><select id="sug_area">${AREAS.map(a=>`<option value="${a.id}">${a.label}</option>`).join('')}</select>
  <label>Name</label><input type="text" id="sug_name" placeholder="e.g. Clock Face Putting">
  <label>Description</label><textarea id="sug_desc" placeholder="How it works and what to aim for"></textarea>
  <button class="btn" style="margin-top:12px" onclick="submitSuggestion()">Submit for Review</button>
  <div class="divider"></div><h2>Approved Suggestions</h2><p class="muted" style="margin-bottom:10px">From other golfers — these are also in your Library or Games tab.</p>${state.suggestionsLoading?'<div class="empty">Loading…</div>':rows}`;
}
function renderReview(){
  if(!isAdmin()) return `<button class="linkback" onclick="switchView('profile')">‹ Profile</button><div class="empty">This area is for the admin only.</div>`;
  const pending = state.pendingSuggestions||[];
  const kindLabel = k => k==='game' ? '🎮 Game' : k==='performance' ? '🏆 Performance drill' : '📋 Practice drill';
  const rows = pending.map(s=>`<div class="card"><span class="pill">${s.kind==='game'?'Game':areaLabel(s.area)}</span> <span class="muted" style="font-size:11.5px">${kindLabel(s.kind)}</span><h2 style="margin-top:8px">${escapeHtml(s.name)}</h2><p class="muted">${escapeHtml(s.description)}</p><p style="font-size:11px" class="muted">from ${escapeHtml(s.author||'a golfer')}${s.authorEmail?' · '+escapeHtml(s.authorEmail):''}</p>
    <div class="rowline" style="margin-top:10px;gap:8px"><button class="btn small" style="flex:1" onclick="approveSuggestion('${s.id}')">✓ Approve</button><button class="btn small danger" style="flex:1;width:auto" onclick="rejectSuggestion('${s.id}')">✕ Reject</button></div></div>`).join('') || '<div class="empty">No suggestions waiting for review. 🎉</div>';
  return `<button class="linkback" onclick="switchView('profile')">‹ Profile</button><h1>Review Suggestions</h1><p class="muted">Approve to publish it for everyone as its own type — drill, performance drill, or game — or reject to delete it.</p>
  ${state.suggestionsLoading?'<div class="empty">Loading…</div>':rows}`;
}

/* The coach message. Defaults to today only; the golfer can tick extra days to include.
   Laid out as clear sections per day, grouped by part of the game. */
function exportDates(){
  const all = [...new Set(state.completions.map(c=>c.date))].sort().reverse();
  if(state.exportDates && state.exportDates.size) return all.filter(d=>state.exportDates.has(d));
  return all.filter(d=>d===todayStr());
}
function buildExportText(){
  const dates = exportDates();
  const L = [];
  L.push('⛳ ' + state.profile.displayName + ' — Range Caddy');
  L.push('🔥 ' + computeStreak() + '-day streak');
  L.push('');
  if(!dates.length){ L.push('No practice logged for the selected day(s).'); return L.join('\n'); }

  dates.forEach((date, di)=>{
    const rows = state.completions.filter(c=>c.date===date);
    const mins = rows.reduce((s,c)=>s+(c.minutes||0),0);
    if(di) L.push('');
    L.push('━━━━━━━━━━━━━━━');
    L.push('📅 ' + prettyDate(date));
    L.push(mins + ' min · ' + rows.filter(r=>!r.sessionLog).length + ' completed');
    L.push('');

    // drills grouped by part of the game
    const byArea = {};
    rows.forEach(c=>{
      if(c.sessionLog || c.isGame) return;
      const d = allDrills().find(x=>x.id===c.drillId);
      const k = d ? d.area : 'other';
      (byArea[k] = byArea[k] || []).push({c, d});
    });
    const order = AREAS.map(a=>a.id).filter(a=>byArea[a]);
    order.forEach(areaId=>{
      L.push(areaLabel(areaId).toUpperCase());
      byArea[areaId].forEach(({c,d})=>{
        L.push('  • ' + (d ? d.name : c.drillId) + durSuffix(c));
      });
      L.push('');
    });

    const games = rows.filter(c=>c.isGame);
    if(games.length){
      L.push('GAMES & TESTS');
      games.forEach(c=>L.push('  • ' + (c.gameName||'Game') + durSuffix(c)));
      L.push('');
    }
    const sess = rows.filter(c=>c.sessionLog);
    if(sess.length) { sess.forEach(c=>L.push('⏱ Session timer: ' + (c.minutes||0) + ' min')); L.push(''); }
  });

  L.push('━━━━━━━━━━━━━━━');
  L.push('🎯 WORKING ON');
  state.ranking.slice(0,3).forEach((a,i)=>L.push('  ' + (i+1) + '. ' + areaLabel(a)));
  if(state.swingWork.length){
    L.push('');
    L.push('🏌️ SWING NOTES');
    state.swingWork.forEach(s=>L.push('  • ' + s.name + (s.description ? ': ' + s.description : '')));
  }
  return L.join('\n');
}
function durSuffix(c){
  if(c.seconds!=null) return ' — ' + fmtTime(c.seconds);
  if(c.minutes!=null) return ' — ' + c.minutes + ' min';
  if(c.tookSeconds!=null) return ' — took ' + fmtTime(c.tookSeconds);
  return ' ✓';
}
function prettyDate(d){
  const p = String(d).split('-');
  const dt = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(dt) ? d : dt.toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'});
}
function shortDate(d){
  const p=String(d).split('-'); const dt=new Date(+p[0],+p[1]-1,+p[2]);
  return isNaN(dt)? d : dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function toggleExportDate(date){
  if(!state.exportDates) state.exportDates = new Set(exportDates());
  if(state.exportDates.has(date)) state.exportDates.delete(date); else state.exportDates.add(date);
  if(!state.exportDates.size) state.exportDates = null;   // back to today-only
  render();
}
function renderExportLog(){
  const text = buildExportText();
  const all = [...new Set(state.completions.map(c=>c.date))].sort().reverse().slice(0,21);
  const picked = new Set(exportDates());
  const chips = all.map(d=>{
    const n = state.completions.filter(c=>c.date===d && !c.sessionLog).length;
    return `<button class="focuschip ${picked.has(d)?'on':''}" onclick="toggleExportDate('${d}')">
      <span class="focustick">${picked.has(d)?'✓':''}</span>${shortDate(d)} <span class="muted" style="font-size:11px">${n}</span></button>`;
  }).join('') || '<p class="muted" style="font-size:12.5px">Nothing logged yet.</p>';
  return `<button class="linkback" onclick="switchView('profile')">‹ Profile</button><h1>Send to Coach</h1>
  <p class="muted">Today's session is included by default. Tick any other days you want to send in the same message.</p>
  <div class="focuscard" style="margin-top:12px">
    <div class="rowline"><strong style="font-size:13.5px">Days to include</strong><span class="muted" style="font-size:12px">${picked.size} selected</span></div>
    <div class="focusgrid" style="grid-template-columns:1fr 1fr">${chips}</div>
  </div>
  <textarea id="export_text" readonly style="width:100%;min-height:280px;font-family:'JetBrains Mono',monospace;font-size:12px">${escapeHtml(text)}</textarea>
  <button class="btn" style="margin-top:10px" onclick="textToCoach()">Text to My Coach</button>
  <button class="btn secondary" style="margin-top:8px" onclick="copyExportLog()">Copy to Clipboard</button>`;
}
function textToCoach(){
  const text = buildExportText();
  const saved = state.profile.coachPhone||'';
  const phone = prompt("Coach's phone number (leave blank to just open Messages):", saved) || '';
  if(phone!==saved){ state.profile.coachPhone=phone; persistProfile(); }
  const clean = phone.replace(/[^\d+]/g,'');
  const body = encodeURIComponent(text);
  window.location.href = (clean? 'sms:'+clean : 'sms:') + (/(iPhone|iPad|Mac)/.test(navigator.userAgent)?'&':'?') + 'body='+body;
}

/* ---------- init ---------- */
/* Splash: fades out once the first real screen is ready. Shown for a short minimum so it
   doesn't flash on a fast load, and force-dismissed after 6s so a failure can never trap you. */
const SPLASH_START = Date.now();
let splashDone = false;
function hideSplash(){
  if(splashDone) return;
  splashDone = true;
  const s = document.getElementById('splash');
  if(!s) return;
  const wait = Math.max(0, 700 - (Date.now() - SPLASH_START));
  setTimeout(()=>{
    s.classList.add('hide');
    setTimeout(()=>{ if(s.parentNode) s.parentNode.removeChild(s); }, 550);
  }, wait);
}
setTimeout(hideSplash, 6000);

async function init(){
  const prof = await sGet('profile', null);
  const act = await sGet('activity', {completions:[],favorites:[],customDrills:[],swingWork:[]});
  const plan = await sGet('plan-cache', null);
  if(prof){ state.profile=prof.profile; state.ranking=prof.ranking;
    if(state.profile && !state.profile.startOrder){ const sa=state.profile.startArea||AREAS[0].id; state.profile.startOrder=[sa, ...AREAS.map(a=>a.id).filter(x=>x!==sa)]; } }
  state.completions=act.completions||[]; state.favorites=act.favorites||[]; state.customDrills=act.customDrills||[]; state.swingWork=act.swingWork||[];
  state.planCache=plan;
  state.seenToday = await sGet('seen-today', null);
  state.focusAreas = await sGet('focus-areas', null);
  if(practiceRunning()){ startNotifLoop(); updatePracticeNotification(true); }
  state.view = state.profile ? 'today' : 'onboarding';
  render();
  hideSplash();
  loadApprovedSuggestions().then(render);   // pull approved community drills into the Library
}

/* The service worker backs the practice notification, so register it up front — it must exist
   whether or not anyone is signed in yet. */
registerSW().then(()=>{
  const a = new URLSearchParams(location.search).get('rcAction');
  if(a) setTimeout(()=>handleNotifAction(a), 600);
});

/* Startup: when accounts are available, auth state decides what shows.
   No user → login/signup screen. Signed in → load their cloud data, then the app. */
if(cloudReady){
  state.view='loading'; render();
  fbAuth.onAuthStateChanged(async (user)=>{
    currentUser = user;
    draftRanking=null; draftStart=null; draftStartOrder=null; draftMode=null; draftPhoto=null; draftFields=null;
    if(user){
      state.authLoading=false; state.authError=null;
      try{ await hydrateFromCloud(user.uid); }catch(e){ console.error('cloud hydrate failed', e); }
      await init();
    }else{
      state.profile=null; state.ranking=null;
      state.completions=[]; state.favorites=[]; state.customDrills=[]; state.swingWork=[]; state.planCache=null;
      state.view='auth'; render(); hideSplash();
    }
  });
}else{
  init();
}
</script>
